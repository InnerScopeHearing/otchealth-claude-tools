name: restore-oauth-secretref

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Container App secret oauth-clients still exists
        run: |
          set -euo pipefail
          az containerapp secret list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[].name" -o table

      - name: Restore OAUTH_CLIENTS env var to reference the secretRef not a literal value
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --set-env-vars "OAUTH_CLIENTS=secretref:oauth-clients"

      - name: Force clean cutover to the restored revision
        run: |
          set -euo pipefail
          sleep 15
          LATEST=$(az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Restored revision: $LATEST"
          az containerapp ingress traffic set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision-weight "${LATEST}=100" || true
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[?name!='${LATEST}' && properties.active].name" -o tsv | while read -r OLD_REV; do
            if [ -n "$OLD_REV" ]; then
              echo "Deactivating: $OLD_REV"
              az containerapp revision deactivate -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision "$OLD_REV" || true
            fi
          done
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight}" -o table

      - name: Verify OAUTH_CLIENTS is now bound via secretRef
        run: |
          set -euo pipefail
          sleep 20
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "properties.template.containers[0].env[?name=='OAUTH_CLIENTS']" -o json

      - name: Summary
        run: |
          echo "OAUTH_CLIENTS secretRef binding restored. A human should test with a real existing client credential to confirm full recovery." >> "$GITHUB_STEP_SUMMARY"
