# Nightly Recall-Quality Eval — scheduled hit@5 regression PAGER for fleet memory recall (W1-4).
#
# P0-3b (Cosmos Brain review F3): recall quality was ASSERTED not MEASURED — the old 12-case suite
# saturated at hit@5 = 12/12 / MRR 1.0, so it could never detect a regression. This runs the recall-evals
# golden set (43 cases: 11 hand-authored + 32 mined + validated from the real cto/coo/commons ledgers;
# see skills/recall-evals/mine-cases.mjs) nightly through the real semantic recall path, emits recall_eval
# to the PostHog Fleet Agents project (the durable trend), and compares hit@5 to the recorded baseline —
# the baseline IS the SLO.
#
# W1-4 (2026-07-17): flipped from report-only to a REAL PAGER, same --strict exit-code convention as
# nightly-azure-canary.yml (skills/azure-canary/canary.mjs). Before this, TWO real miscalibrations made
# the "0.333 baseline" this workflow used to compare against meaningless: (1) 12 of the original 18 golden
# items were tagged agent=commons, a nearly-empty pseudo-lane (3 rows total) that could never surface the
# CTO/COO/CCO facts they actually referenced — fixed by retagging each item to its real originating agent
# lane; (2) run-evals.mjs scored hit@K over raw recall-CLI stdout LINES, but semantic.mjs recall() renders
# each hit as 2-3 lines, so a "top-5" cutoff was silently only evaluating the first ~2 real hits —
# fixed by scoring.mjs's groupHitLines(). The corrected, freshly-mined 43-item set now genuinely hits
# 100% (baseline.json), so a REAL regression (index staleness, embedding drift, a ranking bug, a ledger-
# compaction dropping a cited fact) has real room to show up and page, instead of a permanently-broken
# baseline masking it. continue-on-error is REMOVED: a hit@5 drop past the tolerance now makes this run
# RED (--strict), matching the acceptance bar "a recall-quality drop PAGES, not a dashboard void."
#
# Azure auth = SECRETLESS OIDC (same pattern as nightly-eval.yml): run-evals.mjs / semantic.mjs resolve
# the AI Search + Azure OpenAI + PostHog secrets from Key Vault via kvSecret(); claude-tools CI logs in
# with azure/login federated OIDC (repo VARIABLES AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID + id-token:
# write). No AZURE_SP_* secret at rest. Regression-ledger tag: monitor-azure-auth-oidc.
name: Nightly Recall-Quality Eval

on:
  schedule:
    - cron: '45 6 * * *'    # daily 06:45 UTC (after the 06:30 agent-eval nightly, before the 08:00 medic)
  workflow_dispatch: {}      # manual trigger for testing

permissions:
  id-token: write   # secretless OIDC login to Azure (azure/login); no AZURE_SP_* secret at rest
  contents: read

concurrency:
  group: nightly-recall-eval
  cancel-in-progress: false

jobs:
  recall-eval:
    name: recall hit@5 SLO pager
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless — the claude-tools Azure auth pattern)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Run recall-eval (--strict: RED on a hit@5 drop past the baseline SLO, or a dark sensor)"
        # NO continue-on-error: a real regression (--strict) or a can't-run fatal now fails this step,
        # so the job goes RED and pages instead of writing to a dashboard nobody watches.
        working-directory: skills/recall-evals
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code is tee's, not the command's. Without this line this monitor/gate CANNOT FAIL.
          node run-evals.mjs --emit --baseline baseline.json --tolerance 0.05 --strict --json \
            2>&1 | tee "${GITHUB_WORKSPACE}/nightly-recall-eval.log"

      # A RED run is not a PAGE on its own: the recall SLO was blind because nobody watches the
      # Actions tab. Route a hit@5 regression (or a can't-run/dark-sensor) through the real pager
      # (dual email + PostHog fallback), matching nightly-azure-canary / nightly-fleet-sentinels.
      # Runs from repo root (setup/page-on-failure.mjs), not the recall-evals working-directory.
      - name: Page on failure (email, PostHog fallback)
        if: failure()
        run: node setup/page-on-failure.mjs --workflow "Nightly Recall-Quality Eval" --log "${GITHUB_WORKSPACE}/nightly-recall-eval.log"

      - name: Upload scorecard log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-recall-eval-log
          path: nightly-recall-eval.log
          retention-days: 90
          if-no-files-found: warn

      # ITEM 2.3 (Wave 2, AI-OS research-pass 2026-07-21): schedule-liveness heartbeat, a DIFFERENT
      # failure class than the --strict verdict above. Fires unconditionally (if: always()), regardless
      # of whether the recall-eval step passed or failed, because this beat means "this workflow's own
      # cron fired today", not "recall quality was healthy" (that already pages via the step above). See
      # skills/nightly-schedule-canary/SKILL.md for the full design.
      - name: "Heartbeat: mark this workflow's schedule as alive (independent of the recall-eval's own verdict above)"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-recall-eval ok >/dev/null 2>&1 || true
