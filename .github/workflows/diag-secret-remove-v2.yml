name: diag-secret-remove-v2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/secret-remove-v2

      - name: Azure login (OIDC)
        id: azlogin
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run az command and capture everything
        run: |
          set +e
          {
            echo "=== login outcome: ${{ steps.azlogin.outcome }} ==="
            echo "=== vars present: client_id=$( [ -n '${{ vars.AZURE_CLIENT_ID }}' ] && echo yes || echo no ) tenant_id=$( [ -n '${{ vars.AZURE_TENANT_ID }}' ] && echo yes || echo no ) sub_id=$( [ -n '${{ vars.AZURE_SUBSCRIPTION_ID }}' ] && echo yes || echo no ) ==="
          } > out.txt 2>&1
          az containerapp secret remove -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --secret-names graph-drive-user >> out.txt 2>&1
          echo "EXIT:$?" >> out.txt
          cat out.txt

      - name: Commit and push results (always)
        if: always()
        run: |
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          mkdir -p diagnostics
          cp out.txt diagnostics/secret-remove-error-v2.md 2>/dev/null || echo "login step outcome: ${{ steps.azlogin.outcome }} (no out.txt produced)" > diagnostics/secret-remove-error-v2.md
          git add diagnostics/secret-remove-error-v2.md
          git commit -m "chore: capture secret remove error v2" || echo "nothing to commit"
          git push origin HEAD:diag/secret-remove-v2
