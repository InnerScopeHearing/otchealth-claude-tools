# Nightly encrypted Key Vault export -> AWS S3 + Matt's OneDrive (local disk).
#
# skills/fleet-backup/secrets-dr-export.mjs closes the gap the S3 brain-mirror (nightly-s3-dr-mirror.yml)
# does not cover: if the Azure subscription/tenant were ever lost, an off-Azure copy of the brain is
# useless without the credentials to actually operate anything with it. Every third-party credential
# the fleet holds (GitHub App key, Stripe, PostHog, ASC signing key, Twilio, ElevenLabs, RevenueCat,
# the AWS DR keys themselves, ...) lives ONLY in Key Vault today. This exports every enabled secret,
# AES-256-GCM encrypts the export, and ships the ciphertext to two places outside Azure: the AWS S3 DR
# bucket (secrets-dr/ prefix, alongside the brain mirror) and Matt's OneDrive "CTO Incoming" folder,
# which his OneDrive desktop client mirrors to his local hard disk automatically — satisfying the
# "local disk AND OneDrive" ask with one delivery leg. See secrets-dr-export.mjs's header for the full
# encryption design (the decryption passphrase is deliberately never stored ONLY in Azure).
#
# Runs 10 minutes after the brain mirror (07:00 UTC) so the two nightly DR legs do not race on the
# same OneDrive app registration's token file.

name: Nightly Secrets DR Export

on:
  # SCHEDULE DISARMED 2026-08-27: this workflow authenticates to / exercises the Azure estate
  # on subscription 55c84f6b, which was PERMANENTLY DELETED 2026-08-13 -- every scheduled run
  # since then has failed or produced noise against dead resources. workflow_dispatch is kept.
  # Re-arm only as part of an AWS-native rebuild (see the 2026-08-27 migration-audit report).
  # schedule:
  #   - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch: {}    # manual trigger

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-secrets-dr-export
  cancel-in-progress: false

jobs:
  secrets-dr-export:
    name: encrypted Key Vault export -> S3 + OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless -- lets kvSecret resolve secrets via its az-CLI fallback)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run secrets DR export
        working-directory: skills/fleet-backup
        env:
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -o pipefail
          # OS-level backstop (2026-07-28 review, final round): review correctly kept finding fresh
          # unbounded-fetch call sites inside kvSecret()/vaultToken() (skills/kb-memory/azure-secret.mjs)
          # that no amount of per-call-site JS timeouts inside THIS script can fully close -- direct
          # kvSecret() calls at the top of main() bypass the local timedFetch() wrapper entirely, and
          # even where timedFetch() IS used, 300+ sequential 20s-bounded reads can still sum past the
          # job's own time budget if Key Vault degrades mid-run rather than hanging on one call. `timeout`
          # SIGKILLs the whole process tree unconditionally after 540s (9min) regardless of what is stuck
          # inside any dependency -- this is what actually guarantees the later "Page on failure" step
          # gets to run, not the JS-level timeouts (which remain valuable for keeping the NORMAL-case
          # runtime fast and responsive, just not as the correctness guarantee).
          timeout 540 node secrets-dr-export.mjs run 2>&1 | tee "${GITHUB_WORKSPACE}/secrets-dr-export.log"

      - name: "Verify recovery point (S3 GET + decrypt + count check, logs no values)"
        if: always()
        working-directory: skills/fleet-backup
        env:
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
          SECRETS_DR_PASSPHRASE: ${{ secrets.SECRETS_DR_PASSPHRASE }}
        run: |
          set -o pipefail
          # ALWAYS actually verify, even before SECRETS_DR_PASSPHRASE is provisioned as a repo secret
          # (2026-07-28 review, round 2 -- reverses the earlier warn-and-skip design after review
          # correctly pointed out it conflicts with this fleet's fail-loud posture elsewhere
          # (backup.mjs, s3-mirror.mjs): skipping verification entirely meant a REAL passphrase/format
          # bug could stay hidden until an actual incident, not just the "prerequisite not provisioned
          # yet" case it was meant to tolerate). The insight that resolves the original tradeoff instead
          # of just picking a side: this workflow is running WITH Azure fully healthy (it just did a
          # live export against it in the step above), so it can fall back to the SAME cached passphrase
          # secrets-dr-export.mjs itself uses (`secrets-dr-passphrase` in Key Vault -- see that script's
          # header) when the external repo secret is not yet set, and run the real decrypt-and-count
          # check unconditionally every night. The external SECRETS_DR_PASSPHRASE secret is still the
          # preferred source once provisioned (it is what an actual off-Azure recovery uses), and this
          # step prefers it when present; only if BOTH sources are empty (Key Vault reachable but the
          # cached secret itself missing -- should not happen since the export step always ensures it
          # exists, but defensive) does this step warn and skip, since there would then be no way to
          # even ATTEMPT a decrypt.
          PASS="${SECRETS_DR_PASSPHRASE:-}"
          if [ -z "$PASS" ]; then
            echo "::notice::SECRETS_DR_PASSPHRASE repo secret is not set yet -- falling back to the same Key-Vault-cached passphrase secrets-dr-export.mjs uses, so real verification still runs tonight. Provision the repo secret to also cover the true off-Azure recovery path (Key Vault itself being unreachable), which this fallback does not exercise."
            PASS="$(timeout 30 node -e '
              const { kvSecret } = await import("../kb-memory/azure-secret.mjs");
              const p = await kvSecret("secrets-dr-passphrase");
              if (p) process.stdout.write(p);
            ' --input-type=module)"
          fi
          if [ -z "$PASS" ]; then
            echo "::warning::No passphrase available from either SECRETS_DR_PASSPHRASE or the Key Vault cache -- skipping the restore-verification step (the export/upload above still ran and succeeded; this step only PROVES the result is decryptable, it does not affect whether tonight's backup happened)."
            exit 0
          fi
          timeout 90 node -e '
            const { kvSecret } = await import("../kb-memory/azure-secret.mjs");
            const { s3Get } = await import("./s3-client.mjs");
            const { writeFileSync } = await import("node:fs");
            const akid = await kvSecret("aws-dr-access-key-id");
            const asecret = await kvSecret("aws-dr-secret-access-key");
            const bucket = await kvSecret("aws-dr-s3-bucket");
            const region = await kvSecret("aws-dr-region");
            const date = new Date().toISOString().slice(0, 10);
            const buf = await s3Get({ accessKeyId: akid, secretAccessKey: asecret, bucket, region }, `secrets-dr/kv-otc-${date}.json.enc`);
            writeFileSync("/tmp/verify.enc", buf);
            console.log(`pulled back ${buf.length} bytes from S3`);
          ' --input-type=module
          NAMES=$(SECRETS_DR_PASSPHRASE="$PASS" timeout 30 node secrets-dr-restore.mjs /tmp/verify.enc 2>/dev/null)
          COUNT=$(printf '%s\n' "$NAMES" | grep -c . || true)
          rm -f /tmp/verify.enc
          unset PASS
          echo "verified: decrypt succeeded, ${COUNT} secret names recovered (names only, no values logged)"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::restore-verification recovered 0 secret names -- the archive is not usable"
            exit 1
          fi

      - name: Upload export log (counts/status only -- never contains a secret value)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-dr-export-log
          path: secrets-dr-export.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (email, PostHog fallback)
        if: failure()
        # timeout (2026-07-28 review, final round): page-on-failure.mjs's own internal Promise.race
        # does not CANCEL a hung sendPageEmail() attempt (JS has no true cancellation without threading
        # an AbortSignal through every dependency, including the shared kvSecret()), so this OS-level
        # wrapper is the actual guarantee that this step -- and therefore the whole job -- cannot hang
        # past a bounded time even if something deep inside is stuck on an open socket.
        run: timeout 60 node setup/page-on-failure.mjs --workflow "Nightly Secrets DR Export" --log "${GITHUB_WORKSPACE}/secrets-dr-export.log"

      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        run: timeout 20 node setup/heartbeat.mjs beat nightly-secrets-dr-export ok >/dev/null 2>&1 || true
