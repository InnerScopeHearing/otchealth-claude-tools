# Nightly encrypted AWS SSM (/otchealth/*) secrets export -> a dedicated Object-Lock S3 bucket +
# Matt's OneDrive (local disk).
#
# AWS-NATIVE REBUILD (2026-08-28): this workflow previously authenticated to Azure (azure/login OIDC)
# and ran secrets-dr-export.mjs against Key Vault kv-otc-55c84f6bef, which was PERMANENTLY DELETED
# 2026-08-13 along with the rest of Azure subscription 55c84f6b. That script can never succeed again
# and is left in place unmodified as a historical artifact; see its own header. This workflow now
# authenticates to AWS via GitHub OIDC (no long-lived key at rest) and runs
# skills/fleet-backup/ssm-dr-export.mjs, which backs up AWS SSM Parameter Store /otchealth/* (~455
# params, the store of record since the Azure loss) instead. See
# skills/fleet-backup/ssm-dr-export.mjs's own header for the full design, including why this needs NO
# stored AWS access key at all: the same OIDC-assumed role's temporary credentials sign both the SSM
# reads and the S3 upload.
#
# ONE-TIME PROVISIONING REQUIRED before this can succeed: the S3 bucket, its Object Lock config, the
# KMS key, and the `otchealth-secrets-dr-export` OIDC role this workflow assumes. See the provisioning
# doc this same change adds (runbooks/aws-dr-provisioning.md) for the exact paste-ready `aws` CLI
# commands. Until that role exists, `workflow_dispatch` runs will fail at the credentials step, which
# is the CORRECT behavior (fail loud, not silently no-op) for a required nightly backup.
#
# Runs 10 minutes after the brain/S3 mirror workflow's original 06:50 UTC slot, matching the prior
# Azure-era stagger rationale (two nightly DR legs should not race on the same OneDrive token file).

name: Nightly Secrets DR Export

on:
  # SCHEDULE STAYS DISARMED as of the 2026-08-28 AWS-native rebuild: the one-time provisioning this
  # workflow depends on (the S3 bucket + Object Lock + KMS key + the otchealth-secrets-dr-export OIDC
  # role) has NOT been created yet -- this build ships the code + the exact paste-ready provisioning
  # commands (runbooks/aws-dr-provisioning.md), not the live AWS resources themselves (no AWS CLI/admin
  # credentials in the build sandbox). Re-arm this cron ONLY after: (1) the provisioning doc's commands
  # have been run against a real AWS identity, (2) one INTERACTIVE `workflow_dispatch` run has
  # succeeded end to end (which mints + prints the DR passphrase -- see ssm-dr-export.mjs's header),
  # and (3) SECRETS_DR_PASSPHRASE has been set as a repo secret from that printed value. Until then a
  # scheduled run would just fail nightly at the credentials step for no benefit.
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC -- armed 2026-08-28 after the first interactive run (33139324078) succeeded end to end
  workflow_dispatch: {}    # manual trigger — the intended path for the first interactive run

permissions:
  id-token: write   # GitHub OIDC -> AssumeRoleWithWebIdentity, no long-lived AWS key stored anywhere
  contents: read

concurrency:
  group: nightly-secrets-dr-export
  cancel-in-progress: false

jobs:
  secrets-dr-export:
    name: encrypted SSM export -> S3 + OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC, secretless)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_SECRETS_DR_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-secrets-dr-export' }}
          aws-region: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}

      - name: Run SSM secrets DR export
        working-directory: skills/fleet-backup
        env:
          SECRETS_DR_S3_BUCKET: ${{ vars.SECRETS_DR_S3_BUCKET || 'otchealth-secrets-dr-900915535335' }}
          SECRETS_DR_S3_REGION: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}
        run: |
          set -o pipefail
          # OS-level backstop (mirrors the Azure-era workflow's own reasoning, ported verbatim): a
          # single stalled call anywhere in a ~455-parameter enumeration + encrypt + upload run should
          # never be able to hang past this job's timeout without the pager step ever getting a chance
          # to run. `timeout` SIGKILLs the whole process tree unconditionally.
          timeout 540 node ssm-dr-export.mjs run 2>&1 | tee "${GITHUB_WORKSPACE}/ssm-dr-export.log"

      - name: "Verify recovery point (S3 GET + decrypt + count check, logs no values)"
        if: always()
        working-directory: skills/fleet-backup
        env:
          SECRETS_DR_S3_BUCKET: ${{ vars.SECRETS_DR_S3_BUCKET || 'otchealth-secrets-dr-900915535335' }}
          SECRETS_DR_S3_REGION: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}
          SECRETS_DR_PASSPHRASE: ${{ secrets.SECRETS_DR_PASSPHRASE }}
        run: |
          set -o pipefail
          if [ -z "${SECRETS_DR_PASSPHRASE:-}" ]; then
            echo "::warning::SECRETS_DR_PASSPHRASE repo secret is not set -- skipping the restore-verification step (the export/upload above still ran and succeeded; this step only PROVES the result is decryptable). Provision the repo secret with the passphrase printed on the first interactive run (see ssm-dr-export.mjs's header) to enable real nightly verification."
            exit 0
          fi
          timeout 90 node -e '
            const { awsCreds } = await import("../kb-memory/aws-secret.mjs");
            const { s3Get } = await import("./s3-client.mjs");
            const { writeFileSync } = await import("node:fs");
            const c = await awsCreds();
            const bucket = process.env.SECRETS_DR_S3_BUCKET;
            const region = process.env.SECRETS_DR_S3_REGION;
            const date = new Date().toISOString().slice(0, 10);
            const buf = await s3Get({ accessKeyId: c.ak, secretAccessKey: c.sk, sessionToken: c.st, bucket, region }, `secrets-dr/daily/ssm-otchealth-${date}.json.enc`);
            if (!buf) throw new Error("today'\''s archive was not found in S3 right after the export step claimed success");
            writeFileSync("/tmp/verify.enc", buf);
            console.log(`pulled back ${buf.length} bytes from S3`);
          ' --input-type=module
          NAMES=$(timeout 30 node secrets-dr-restore.mjs /tmp/verify.enc 2>/dev/null)
          COUNT=$(printf '%s\n' "$NAMES" | grep -c . || true)
          rm -f /tmp/verify.enc
          echo "verified: decrypt succeeded, ${COUNT} secret names recovered (names only, no values logged)"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::restore-verification recovered 0 secret names -- the archive is not usable"
            exit 1
          fi

      - name: Upload export log (counts/status only -- never contains a secret value)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssm-dr-export-log
          path: skills/fleet-backup/ssm-dr-export.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (email, PostHog fallback)
        if: failure()
        run: timeout 60 node setup/page-on-failure.mjs --workflow "Nightly Secrets DR Export" --log "${GITHUB_WORKSPACE}/skills/fleet-backup/ssm-dr-export.log"

      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        # DEGRADE LOUDLY, NOT SILENTLY (2026-08-28): heartbeat.mjs's storage backend still targets the
        # permanently-dead Azure Blob account (a separate, parallel port -- see
        # otchealth-claude-tools/CLAUDE.md's "TOOLKIT PORTS still needed" list). This step is expected
        # to fail until that port lands; a bare `|| true` would hide that fact, so failure prints a
        # visible GitHub Actions warning annotation instead of being swallowed silently. This job's own
        # pass/fail (the actual backup) is completely unaffected either way -- `continue-on-error` above
        # already guarantees that.
        run: |
          timeout 20 node setup/heartbeat.mjs beat nightly-secrets-dr-export ok \
            || echo "::warning::heartbeat beat did not land (heartbeat.mjs's Azure Blob backend has not been ported to AWS yet -- this workflow's own pass/fail above is unaffected)"
