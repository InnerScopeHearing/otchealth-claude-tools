# Nightly encrypted Key Vault export -> AWS S3 + Matt's OneDrive (local disk).
#
# skills/fleet-backup/secrets-dr-export.mjs closes the gap the S3 brain-mirror (nightly-s3-dr-mirror.yml)
# does not cover: if the Azure subscription/tenant were ever lost, an off-Azure copy of the brain is
# useless without the credentials to actually operate anything with it. Every third-party credential
# the fleet holds (GitHub App key, Stripe, PostHog, ASC signing key, Twilio, ElevenLabs, RevenueCat,
# the AWS DR keys themselves, ...) lives ONLY in Key Vault today. This exports every enabled secret,
# AES-256-GCM encrypts the export, and ships the ciphertext to two places outside Azure: the AWS S3 DR
# bucket (secrets-dr/ prefix, alongside the brain mirror) and Matt's OneDrive "CTO Incoming" folder,
# which his OneDrive desktop client mirrors to his local hard disk automatically — satisfying the
# "local disk AND OneDrive" ask with one delivery leg. See secrets-dr-export.mjs's header for the full
# encryption design (the decryption passphrase is deliberately never stored ONLY in Azure).
#
# Runs 10 minutes after the brain mirror (07:00 UTC) so the two nightly DR legs do not race on the
# same OneDrive app registration's token file.

name: Nightly Secrets DR Export

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch: {}    # manual trigger

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-secrets-dr-export
  cancel-in-progress: false

jobs:
  secrets-dr-export:
    name: encrypted Key Vault export -> S3 + OneDrive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless -- lets kvSecret resolve secrets via its az-CLI fallback)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run secrets DR export
        working-directory: skills/fleet-backup
        env:
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -o pipefail
          node secrets-dr-export.mjs run 2>&1 | tee "${GITHUB_WORKSPACE}/secrets-dr-export.log"

      - name: Upload export log (counts/status only -- never contains a secret value)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secrets-dr-export-log
          path: secrets-dr-export.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (email, PostHog fallback)
        if: failure()
        run: node setup/page-on-failure.mjs --workflow "Nightly Secrets DR Export" --log "${GITHUB_WORKSPACE}/secrets-dr-export.log"

      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-secrets-dr-export ok >/dev/null 2>&1 || true
