name: URGENT-restore-oauth-clients-secretref

# URGENT PRODUCTION REGRESSION FIX.
#
# Root cause (confirmed via full revision history audit, 2026-07-06 17:33 UTC): OAUTH_CLIENTS was NEVER
# a literal env value on otchealth-mcp-gateway. For 95+ revisions since 2026-06-25, it was bound as
# `{"name": "OAUTH_CLIENTS", "secretRef": "oauth-clients"}` — reading the real client registry
# (cfo/clo/coo/cro/clo-personal/etc, 558 bytes, last updated 2026-07-03) from a Container App secret
# named "oauth-clients" (which is itself Key-Vault-backed). Tonight's first fix attempt at ~16:30 UTC
# ran `az containerapp update --set-env-vars OAUTH_CLIENTS="..."`, which REPLACES a secretRef binding
# with a literal value — and due to a separate empty-file/jq bug, that literal value was empty ("").
# This wiped the secretRef binding on the currently-active revision (--0000032), which has been serving
# ALL live traffic since ~16:30 UTC. Every pre-existing OAuth client (cfo, clo, coo, cro, clo-personal,
# etc) has likely been UNABLE to mint a fresh client_credentials token since then, though any token
# minted before 16:30 UTC would still be valid until its 1-hour expiry.
#
# THE ACTUAL DATA WAS NEVER TOUCHED: the Key Vault secret "oauth-clients" itself (558 bytes) was
# confirmed intact and untouched throughout tonight's work — only the Container App's binding TO it
# was broken. This fix restores that binding; it does not need to reconstruct any lost data.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm the Container App secret "oauth-clients" still exists (should be untouched)
        run: |
          set -euo pipefail
          echo "--- Container App-level secrets (names only, never values) ---"
          az containerapp secret list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[].name" -o table

      - name: Restore OAUTH_CLIENTS env var to reference the secretRef (NOT a literal value)
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --set-env-vars "OAUTH_CLIENTS=secretref:oauth-clients"

      - name: Deactivate the broken revision(s), force clean cutover to the restored one (lesson learned earlier tonight: traffic weight alone is not enough)
        run: |
          set -euo pipefail
          sleep 15
          LATEST=$(az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Restored/latest revision: $LATEST"
          az containerapp ingress traffic set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --revision-weight "${LATEST}=100" || true
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[?name!='${LATEST}' && properties.active].name" -o tsv | while read -r OLD_REV; do
            if [ -n "$OLD_REV" ]; then
              echo "Deactivating broken revision: $OLD_REV"
              az containerapp revision deactivate -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision "$OLD_REV" || true
            fi
          done
          echo "--- Post-restore revision state ---"
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight}" -o table

      - name: Verify OAUTH_CLIENTS is now properly bound (secretRef, no literal value) - structural check only
        run: |
          set -euo pipefail
          sleep 20
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env[?name=='OAUTH_CLIENTS']" -o json

      - name: Summary
        run: |
          echo "### OAUTH_CLIENTS secretRef binding restored" >> "$GITHUB_STEP_SUMMARY"
          echo "This does NOT verify a live token mint (no pre-existing client secret is available to this workflow)." >> "$GITHUB_STEP_SUMMARY"
          echo "A human should test with a REAL existing client (e.g. an oc_cfo_* credential) to confirm full recovery." >> "$GITHUB_STEP_SUMMARY"
