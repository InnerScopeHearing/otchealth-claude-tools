# Gateway oauth-clients canary — enforces the invariant that the live gateway OAUTH_CLIENTS registry
# contains EVERY canonical client (all oauth-lane-* client_credentials lanes + all oauth-connector-*
# Claude-Chat connector clients in Key Vault). Turns the 2026-07-13 connector outage
# (oauth-clients-patch-drops-dcr-clients) from a memory rule into an enforced, scheduled check: if any
# canonical client is missing from the live gateway registry, the job FAILS loudly instead of a human
# discovering a dead connector days later. Repair is `reconcile` (union-restore; never drops) — run it
# from a trusted seat, not from CI, since it mutates the production gateway secret.
#
# Read-only check: needs only ARM listSecrets on the gateway + KV secret reads, via the same secretless
# OIDC identity the other claude-tools monitors use (azure/login + repo VARIABLES; no secret at rest).
name: oauth-clients-canary

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6h, offset so it does not collide with the on-the-hour job fleet
  workflow_dispatch:

permissions:
  id-token: write     # secretless OIDC login to Azure; no client secret at rest
  contents: read

jobs:
  canary:
    name: gateway oauth-clients invariant
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless — main-context azure-sp)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check the gateway oauth-clients invariant (fails on any missing canonical client)
        # No env creds: azure/login authenticated the runner; the canary resolves ARM + Key Vault tokens
        # via `az account get-access-token`. Exit 3 = a canonical lane/connector client is MISSING.
        run: node setup/oauth-clients-canary.mjs check

      # ITEM 2.3 (Wave 2, AI-OS research-pass 2026-07-21): schedule-liveness heartbeat, a DIFFERENT
      # failure class than the invariant check above. Fires unconditionally (if: always()), regardless
      # of whether the check step passed or failed, because this beat means "this workflow's own 6-hourly
      # cron fired", not "the oauth-clients registry was healthy" (that check fails the job on its own
      # terms; this repo's default GitHub Actions failure notification is the only page today, which is
      # a separate known gap, not one this heartbeat closes). This heartbeat's OWN registry entry
      # ("oauth-clients-canary" in setup/heartbeat-registry.json) uses an 8h SLO (not the ~26h used for
      # the daily nightly workflows) since this one runs every 6h. See
      # skills/nightly-schedule-canary/SKILL.md for the full design.
      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat oauth-clients-canary ok >/dev/null 2>&1 || true
