# Nightly verification canary for the AWS-native DR chain: SSM secrets export, OpenSearch off-domain snapshot,
# RDS automated snapshot, the n8n Lightsail AutoSnapshot + /healthz, the weekly restore-proof drill, per-room brain
# freshness and ring residue. See skills/aws-dr-canary/SKILL.md for the full design ("AGE not a doc-count floor": a
# frozen/stalled backup never trips a floor, only its age can catch it).
#
# Runs AFTER nightly-secrets-dr-export.yml (07:00 UTC) and the OpenSearch Snapshot Management policy's own 07:00 UTC
# run, giving both legs time to land before this checks their freshness. Armed 2026-08-28. Read-only except the weekly
# drill's bounded restore+delete of a throwaway drill-* index; a missing resource reports as a normal STALE/ERROR row.
#
# PAGER (2026-10-07, a REGRESSION of the July "silent monitor" family). This job assumes the READ-ONLY OIDC role
# otchealth-aws-dr-canary, which cannot read the SSM parameters the email and PostHog pager channels need
# (/otchealth/oauth-lane-cto-id, /otchealth/oauth-lane-cto-secret, /otchealth/posthog-fleet-ingest-key). The canary was
# red every day 2026-09-29..2026-10-06 and its pager step failed every time, so nobody was told. "Page on failure" is
# now the LAST step (so it also reports a failed heartbeat) and it opens/comments on ONE tracking issue titled
# "[FLEET-ALERT] nightly-aws-dr-canary" with the job's own GITHUB_TOKEN (permission issues: write), a channel that needs
# nothing from the role. Email and PostHog stay as extra channels; the issue names whichever of them did not land.
# Every alert mentions the owner so GitHub itself emails/pushes them: PAGE_GITHUB_MENTION defaults to @GBGolfMatt and the
# repo variable FLEET_ALERT_MENTION overrides it (it needs the leading at sign: setup/alert-issue.mjs's parseMentions drops
# a bare login). Set the repo secret POSTHOG_FLEET_INGEST_KEY to light up the PostHog channel without widening the role.
#
# The Heartbeat step stays fatal on purpose (tests/nightly-aws-dr-heartbeat.test.mjs): a denied heartbeat write must be
# visible, never swallowed. tests/nightly-aws-dr-pager.test.mjs pins the pager wiring below.

name: Nightly AWS DR Canary

on:
  schedule:
    - cron: '45 8 * * *'   # daily 08:45 UTC, after the secrets export + the OpenSearch SM policy's own 07:00 UTC run
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  issues: write   # the guaranteed pager: setup/page-on-failure.mjs opens/comments on the [FLEET-ALERT] issue with GITHUB_TOKEN

concurrency:
  group: nightly-aws-dr-canary
  cancel-in-progress: false

jobs:
  aws-dr-canary:
    name: SSM + OpenSearch + RDS backup freshness, weekly restore-proof drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC, secretless, read-only role)
        id: aws
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DR_CANARY_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-aws-dr-canary' }}
          aws-region: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}

      - name: Run the canary (--strict pages on any anomaly)
        id: canary
        env:
          SECRETS_DR_S3_BUCKET: ${{ vars.SECRETS_DR_S3_BUCKET || 'otchealth-secrets-dr-900915535335' }}
          SECRETS_DR_S3_REGION: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}
          OS_DOMAIN_NAME: ${{ vars.OS_DOMAIN_NAME || 'otchealth-brain' }}
          OS_SNAPSHOT_REPO: ${{ vars.OS_SNAPSHOT_REPO || 'otchealth-brain-s3' }}
          RDS_DB_INSTANCE_ID: ${{ vars.RDS_DB_INSTANCE_ID || 'otchealth-pg' }}
          N8N_LIGHTSAIL_INSTANCE_NAME: ${{ vars.N8N_LIGHTSAIL_INSTANCE_NAME || 'otchealth-cs-n8n' }}
          N8N_HEALTHZ_URL: ${{ vars.N8N_HEALTHZ_URL || 'https://cs-n8n.otchealthmart.com/healthz' }}
          SECRETS_DR_PASSPHRASE: ${{ secrets.SECRETS_DR_PASSPHRASE }}
        run: |
          set -o pipefail
          timeout 480 node skills/aws-dr-canary/canary.mjs --strict 2>&1 | tee "${GITHUB_WORKSPACE}/aws-dr-canary.log"

      - name: "Heartbeat: mark this workflow's schedule as alive"
        id: heartbeat
        if: always()
        run: |
          set -o pipefail
          timeout 20 node setup/heartbeat.mjs beat nightly-aws-dr-canary ok 2>&1 | tee "${RUNNER_TEMP:-/tmp}/aws-dr-heartbeat.log"

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-dr-canary-log
          path: |
            aws-dr-canary.log
            ${{ runner.temp }}/aws-dr-heartbeat.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (email, PostHog fallback)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_FLEET_INGEST_KEY: ${{ secrets.POSTHOG_FLEET_INGEST_KEY }}
          PAGE_GITHUB_MENTION: ${{ vars.FLEET_ALERT_MENTION || '@GBGolfMatt' }}
          PAGE_STEP_OUTCOMES: "aws=${{ steps.aws.outcome }} canary=${{ steps.canary.outcome }} heartbeat=${{ steps.heartbeat.outcome }}"
        run: timeout 120 node setup/page-on-failure.mjs --workflow "Nightly AWS DR Canary" --github-issue "[FLEET-ALERT] nightly-aws-dr-canary" --log "${GITHUB_WORKSPACE}/aws-dr-canary.log" --log "${RUNNER_TEMP}/aws-dr-heartbeat.log"
