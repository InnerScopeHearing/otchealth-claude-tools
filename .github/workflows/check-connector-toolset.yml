name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check id-otc-jobs-kv RBAC across vault, ACR, and legal storage account
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          PID="29f8b1b3-d293-43bf-8e3a-093ee4007a90"
          {
            echo "# doc-indexer RBAC diagnostic v2 - $(date -u)"
            echo ""
            echo "## Raw role assignment list for id-otc-jobs-kv (principalId $PID)"
            echo '```json'
            az role assignment list --assignee "$PID" --all -o json || echo "CLI_ERROR_EXIT_$?"
            echo '```'
            echo ""
            echo "## Role assignments scoped just at the legal storage account"
            echo '```json'
            az role assignment list --assignee "$PID" --scope /subscriptions/55c84f6b-ef90-4259-a58b-50835cc4cab4/resourceGroups/otchealth-automation-rg/providers/Microsoft.Storage/storageAccounts/otchealthlegalstore -o json || echo "CLI_ERROR_EXIT_$?"
            echo '```'
            echo ""
            echo "## Role assignments scoped just at the vault"
            echo '```json'
            az role assignment list --assignee "$PID" --scope /subscriptions/55c84f6b-ef90-4259-a58b-50835cc4cab4/resourceGroups/rg-otchealth-shared-prod/providers/Microsoft.KeyVault/vaults/kv-otc-55c84f6bef -o json || echo "CLI_ERROR_EXIT_$?"
            echo '```'
            echo ""
            echo "## Role assignments scoped just at the ACR"
            echo '```json'
            az role assignment list --assignee "$PID" --scope /subscriptions/55c84f6b-ef90-4259-a58b-50835cc4cab4/resourceGroups/otchealth-automation-rg/providers/Microsoft.ContainerRegistry/registries/otchealthacr -o json || echo "CLI_ERROR_EXIT_$?"
            echo '```'
          } > diagnostics/connector-toolset.md
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Diagnostic v2: doc-indexer identity RBAC raw dump"
          git push origin "$BRANCH" --force
