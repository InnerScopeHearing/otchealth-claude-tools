name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: List oauth-lane-clo* and legal/graph related secret NAMES only (never values)
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          {
            echo "# CLO gateway lane secret inventory (names only) - $(date -u)"
            echo ""
            echo '```'
            az keyvault secret list --vault-name kv-otc-55c84f6bef --query "[].name" -o tsv | grep -i "clo\|legal\|gateway-oauth" | sort
            echo '```'
          } > diagnostics/pull-log.md 2>&1
          cat diagnostics/pull-log.md

      - name: Commit findings
        if: always()
        run: |
          set -uo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          git checkout -B diag-connector-toolset-latest
          git add diagnostics/pull-log.md
          git commit -m "Diagnostic: CLO gateway lane secret name inventory"
          git push origin diag-connector-toolset-latest --force
