name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check id-otc-jobs-kv RBAC across vault, ACR, and legal storage account
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "# doc-indexer RBAC diagnostic - $(date -u)"
            echo ""
            SUB="55c84f6b-ef90-4259-a58b-50835cc4cab4"
            PID=$(az identity show -n id-otc-jobs-kv -g otchealth-automation-rg --query principalId -o tsv 2>&1) || PID="ERROR: $PID"
            echo "## id-otc-jobs-kv principalId"
            echo '```'
            echo "$PID"
            echo '```'
            echo ""
            echo "## All role assignments for this identity"
            echo '```json'
            az role assignment list --assignee "$PID" --all -o json 2>&1 | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps([{'role':a['roleDefinitionName'],'scope':a['scope']} for a in d], indent=2))" 2>&1 || echo "ERROR parsing"
            echo '```'
            echo ""
            echo "## Legal storage account (otchealthlegalstore) - does it exist, what RG"
            echo '```json'
            az storage account show -n otchealthlegalstore --query "{name:name, rg:resourceGroup, id:id}" -o json 2>&1 || echo "NOT FOUND"
            echo '```'
          } > diagnostics/connector-toolset.md
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Diagnostic: doc-indexer identity RBAC check"
          git push origin "$BRANCH" --force
