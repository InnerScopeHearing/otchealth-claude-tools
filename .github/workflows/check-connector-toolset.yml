name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Dump current full env (names + secretRef only, redact literal values that look sensitive)
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env-now.json
          python3 - <<'PYEOF2'
          import json
          env = json.load(open('/tmp/env-now.json'))
          out = []
          for e in env:
              name = e.get('name','')
              if 'secretRef' in e:
                  out.append({"name": name, "secretRef": e['secretRef']})
              else:
                  sensitive = any(k in name.upper() for k in ['SECRET','KEY','TOKEN','PASSWORD','CLIENTS'])
                  out.append({"name": name, "value": "[REDACTED]" if sensitive else e.get('value')})
          with open('diagnostics/connector-toolset.md','w') as f:
              f.write("# Current full env (redacted) - " + __import__('subprocess').getoutput('date -u') + "\n\n")
              f.write("```json\n")
              f.write(json.dumps(out, indent=2))
              f.write("\n```\n")
          PYEOF2
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Diagnostic: full current env dump"
          git push origin "$BRANCH" --force
