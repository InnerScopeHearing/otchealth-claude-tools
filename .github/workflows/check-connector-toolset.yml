name: diag-kb-memory-secret

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check azure-commons-storage-key secret existence + metadata (no value)
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "# kb-memory secret diagnostic - $(date -u)"
            echo ""
            echo "## Secret: azure-commons-storage-key"
            echo '```json'
            az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-commons-storage-key \
              --query "{enabled:attributes.enabled, created:attributes.created, updated:attributes.updated, expires:attributes.expires}" -o json 2>&1 || echo '"NOT FOUND OR ERROR"'
            echo '```'
            echo ""
            echo "## Secret: azure-commons-storage-account (if separate)"
            echo '```json'
            az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-commons-storage-account \
              --query "{enabled:attributes.enabled, created:attributes.created, updated:attributes.updated}" -o json 2>&1 || echo '"NOT FOUND OR ERROR"'
            echo '```'
            echo ""
            echo "## RBAC check - does azure-sp have Key Vault Secrets User/Officer role"
            echo '```json'
            az role assignment list --assignee 34a7326b-5ed0-4f6c-b5b4-483772a15a69 --scope /subscriptions/55c84f6b-ef90-4259-a58b-50835cc4cab4/resourceGroups/rg-otchealth-shared-prod/providers/Microsoft.KeyVault/vaults/kv-otc-55c84f6bef --query "[].roleDefinitionName" -o json 2>&1 || echo '"ERROR"'
            echo '```'
            echo ""
            echo "## Storage account otchealthcommons - does the actual storage account key match?"
            echo '```json'
            az storage account keys list --account-name otchealthcommons --query "[0].{keyName:keyName, lastCreated:creationTime}" -o json 2>&1 || echo '"NOT FOUND OR ERROR (may be in different RG/subscription)"'
            echo '```'
          } > diagnostics/connector-toolset.md
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Diagnostic: kb-memory azure-commons-storage-key check"
          git push origin "$BRANCH" --force
