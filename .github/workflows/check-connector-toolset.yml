name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Grant Storage Blob Data Contributor to id-otc-jobs-kv on otchealthlegalstore
        run: |
          set -euo pipefail
          PID="29f8b1b3-d293-43bf-8e3a-093ee4007a90"
          SCOPE="/subscriptions/55c84f6b-ef90-4259-a58b-50835cc4cab4/resourceGroups/otchealth-automation-rg/providers/Microsoft.Storage/storageAccounts/otchealthlegalstore"
          mkdir -p diagnostics
          {
            echo "# Grant doc-indexer identity write access to legal storage - $(date -u)"
            echo ""
            echo "## Creating role assignment: Storage Blob Data Contributor"
            echo '```json'
            az role assignment create --assignee-object-id "$PID" --assignee-principal-type ServicePrincipal \
              --role "Storage Blob Data Contributor" --scope "$SCOPE" -o json
            echo '```'
            echo ""
            echo "## Verify: role assignments now at this scope"
            echo '```json'
            sleep 10
            az role assignment list --assignee "$PID" --scope "$SCOPE" -o json
            echo '```'
          } > diagnostics/connector-toolset.md
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Grant: id-otc-jobs-kv Storage Blob Data Contributor on otchealthlegalstore"
          git push origin "$BRANCH" --force
