name: check-connector-toolset

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check CONNECTOR_TOOLSET env var, revision split, and image tags
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo "# Gateway diagnostic - $(date -u)"
            echo ""
            echo "## CONNECTOR_TOOLSET env var"
            echo '```json'
            az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
              --query "properties.template.containers[0].env[?name=='CONNECTOR_TOOLSET']" -o json
            echo '```'
            echo ""
            echo "## ALL active revisions + traffic weight + image + created time"
            echo '```json'
            az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
              --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight, createdTime:properties.createdTime, replicas:properties.replicas, image:properties.template.containers[0].image}" -o json
            echo '```'
            echo ""
            echo "## Ingress traffic config (source of truth for routing split)"
            echo '```json'
            az containerapp ingress traffic show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod -o json
            echo '```'
          } > diagnostics/connector-toolset.md
          cat diagnostics/connector-toolset.md

      - name: Commit findings to a FIXED branch (force-push, overwritten each run)
        run: |
          set -euo pipefail
          git config user.name "cto-diagnostic-bot"
          git config user.email "cto-bot@otchealth.app"
          BRANCH="diag-connector-toolset-latest"
          git checkout -B "$BRANCH"
          git add diagnostics/connector-toolset.md
          git commit -m "Diagnostic: revision split + CONNECTOR_TOOLSET check"
          git push origin "$BRANCH" --force
          echo "Pushed to fixed branch: $BRANCH"
