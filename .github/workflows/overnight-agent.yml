# Overnight / unattended AGENT runner — the Tier-2 reference (Fleet Intelligence #4/#5).
# Runs Claude Code HEADLESS on the Claude Max 20x SUBSCRIPTION (zero metered API spend), on a schedule
# or on demand. See runbooks/overnight-autonomy.md (otchealth-cto) for the full standard.
#
# ONE setup step (Matt, once): `claude setup-token` -> paste the one-year token -> store it as the
#   CLAUDE_CODE_OAUTH_TOKEN secret (repo or org). Until that secret exists this workflow is a no-op.
# It is dispatch-only by default; uncomment the schedule to arm the nightly run.
name: Overnight Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "The task prompt for the headless agent"
        required: true
        default: "Summarize what changed in this repo in the last 24h and open a draft PR with a short report."
      allow_bedrock_overflow:
        description: "Opt in to the AWS Bedrock overflow lane if CLAUDE_CODE_OAUTH_TOKEN is unavailable (needs AWS credentials too; see runbooks/overnight-autonomy.md, ships inert otherwise)"
        required: false
        type: boolean
        default: false
  # schedule DISARMED 2026-07-21. The default "summarize 24h changes" task delivered zero realized
  # value across ~29 consecutive nights (0 PRs merged/reviewed; the last 7 nights produced only the run
  # log) while drawing the SHARED Claude Max weekly limit that the CTO + Developer seats also consume,
  # and the daily change-digest is already covered by the Tier-1 Azure `daily-digest` Container Apps Job
  # (zero Max draw). Kept fully functional DISPATCH-ONLY for a real on-demand overnight task. To re-arm,
  # uncomment below AND set a task worth a Max session (the default summarize task is NOT).
  # schedule:
  #   - cron: "0 9 * * *"   # 09:00 UTC ~= 02:00 PT

permissions:
  contents: write
  pull-requests: write
  # id-token: write   # uncomment alongside the OIDC role-assume step below when that lane is armed

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      # The Max-plan OAuth token (from `claude setup-token`). Subscription auth, NOT a metered key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Phase 6 AI-OS: the bounded AWS Bedrock overflow lane, opt-in, for when the Max weekly limit
      # is hit (see setup/select-agent-auth.sh and runbooks/overnight-autonomy.md). The OAuth token
      # above still wins unconditionally whenever it is set. Ships INERT: none of the AWS_* secrets
      # below are provisioned yet (a Matt gate) and allow_bedrock_overflow defaults to false, so this
      # lane never fires until BOTH land. A `schedule` trigger carries no inputs at all, hence the
      # fallback, matching the TASK fallback further down. AWS_BEARER_TOKEN_BEDROCK is the simplest
      # single secret to provision (a Bedrock API key, no full IAM pair); the ACCESS_KEY_ID/
      # SECRET_ACCESS_KEY pair is the fallback. Never commit a secret VALUE, only reference secret
      # NAMES here.
      ALLOW_BEDROCK_OVERFLOW: ${{ github.event.inputs.allow_bedrock_overflow || 'false' }}
      AWS_REGION: ${{ secrets.AWS_BEDROCK_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_BEDROCK_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_BEDROCK_SESSION_TOKEN }}
      AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
    steps:
      - uses: actions/checkout@v4

      # RECOMMENDED (more secure than the long-lived AWS_BEDROCK_ACCESS_KEY_ID/SECRET pair above):
      # assume an AWS IAM role via GitHub's OIDC provider instead of storing static AWS keys as
      # secrets. Uncomment this step AND the `id-token: write` permission above once the role exists;
      # it exports AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN itself, so
      # setup/select-agent-auth.sh's AWS-credential check picks them up with no other change needed.
      # - name: Assume the Bedrock overflow IAM role (OIDC, no long-lived key)
      #   if: ${{ github.event.inputs.allow_bedrock_overflow == 'true' || github.event.inputs.allow_bedrock_overflow == true }}
      #   uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      #   with:
      #     role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
      #     aws-region: ${{ secrets.AWS_BEDROCK_REGION }}

      - name: Select agent auth (subscription, or opt-in Bedrock overflow)
        run: source setup/select-agent-auth.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the agent task (subscription auth, zero metered spend)
        env:
          # Pass the task through an env var (never interpolate ${{ }} directly into the shell = injection-safe).
          # On a `schedule` trigger there are no inputs, so fall back to the default standing task.
          TASK: ${{ github.event.inputs.task || 'Summarize what changed in this repo in the last 24h and open a draft PR with a short report.' }}
        run: |
          # ANTHROPIC_API_KEY takes precedence over the OAuth token; ensure it is unset so we stay on the Max plan.
          unset ANTHROPIC_API_KEY
          # Safety rails for the unattended run (this repo is non-PHI; main is push-protected).
          RAILS='Operating rules: work only on a claude/* branch and open DRAFT PRs; never push to main; never touch PHI (MedReview/FourVault) or INND/HearingAssist securities or financial data; if you hit a hard gate (payment, KYC, account signup, OAuth consent) stop and leave a note instead. '
          # pipefail: without it the step's exit status is tee's, so a failed overnight agent reported GREEN.
          set -o pipefail
          claude -p "${RAILS}${TASK}" \
            --permission-mode acceptEdits \
            --output-format json | tee result.json \
            || echo "::warning::[overnight-agent] agent exited non-zero; the safety-net step still persists any work."

      # SAFETY NET: persist whatever the agent left even if it never ran git itself, so an unattended
      # overnight run can never silently discard its work. Captures uncommitted changes (and local
      # commits) onto a claude/* branch and opens a DRAFT PR. NEVER pushes to the default branch.
      - name: Persist agent work to a draft PR (safety net)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
          TASK: ${{ github.event.inputs.task || 'Summarize what changed in this repo in the last 24h and open a draft PR with a short report.' }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --quiet || true

          DIRTY=0; [ -n "$(git status --porcelain)" ] && DIRTY=1
          AHEAD=$(git rev-list --count "origin/${DEFAULT_BRANCH}..HEAD" 2>/dev/null || echo 0)
          if [ "$DIRTY" = "0" ] && [ "$AHEAD" = "0" ]; then
            echo "No agent work to persist (clean working tree, no new commits)."; exit 0
          fi

          PUSHED_ELSEWHERE=$(git branch -r --contains HEAD 2>/dev/null | sed 's/^[ *]*//' \
            | grep '^origin/' | grep -v "^origin/${DEFAULT_BRANCH}$" | head -1 || true)
          if [ "$DIRTY" = "0" ] && [ -n "$PUSHED_ELSEWHERE" ]; then
            echo "Agent already pushed HEAD to ${PUSHED_ELSEWHERE}; safety net not needed."; exit 0
          fi

          BRANCH="claude/overnight-${RUN_ID}"
          git checkout -B "$BRANCH"
          if [ "$DIRTY" = "1" ]; then
            git add -A
            git commit -m "overnight run ${RUN_ID}: capture agent work" \
              -m "Auto-captured at the end of the overnight run so nothing is lost. Task: ${TASK}"
          fi
          git push -u origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "Draft PR already exists for ${BRANCH}."
          elif gh pr create --draft --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "Overnight run ${RUN_ID}: $(printf '%s' "$TASK" | head -c 60)" \
              --body "Automated draft PR capturing the work of overnight run [\`${RUN_ID}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}).

          **Task:** ${TASK}

          Unattended subscription-auth run. Review before merge."; then
            echo "Draft PR created for ${BRANCH}."
          else
            # Do NOT silently swallow a real failure: the branch is pushed but no PR opened. Surface it
            # loudly (a swallowed failure here is why ~29 overnight runs never produced a reviewable PR).
            echo "::warning::[overnight-agent] gh pr create FAILED for ${BRANCH} (branch pushed, PR not opened). Check gh auth / pull-requests:write permission."
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-agent-result
          path: result.json
