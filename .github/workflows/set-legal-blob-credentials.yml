name: set-legal-blob-credentials

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  wire-legal-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot current env (before)
        run: |
          set -euo pipefail
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env-before.json
          echo "Snapshot entry count:"
          python3 -c "import json; print(len(json.load(open('/tmp/env-before.json'))))"

      - name: Read legal storage creds from Key Vault and set as Container App secrets
        run: |
          set -euo pipefail
          ACCT=$(az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-legal-storage-account --query value -o tsv)
          KEY=$(az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-legal-storage-key --query value -o tsv)
          az containerapp secret set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --secrets "azure-legal-storage-account=${ACCT}" "azure-legal-storage-key=${KEY}"
          unset ACCT KEY

      - name: Point env vars at the new secretRefs
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --set-env-vars \
              "AZURE_LEGAL_STORAGE_ACCOUNT=secretref:azure-legal-storage-account" \
              "AZURE_LEGAL_STORAGE_KEY=secretref:azure-legal-storage-key"

      - name: Force clean cutover to the new revision
        run: |
          set -euo pipefail
          sleep 15
          LATEST=$(az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "New revision: $LATEST"
          az containerapp ingress traffic set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision-weight "${LATEST}=100" || true
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[?name!='${LATEST}' && properties.active].name" -o tsv | while read -r OLD_REV; do
            if [ -n "$OLD_REV" ]; then
              echo "Deactivating: $OLD_REV"
              az containerapp revision deactivate -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision "$OLD_REV" || true
            fi
          done

      - name: Regression check - confirm unrelated env vars untouched
        run: |
          set -euo pipefail
          sleep 5
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env-after.json
          python3 - <<'PYEOF2'
          import json
          before = {e["name"]: e for e in json.load(open("/tmp/env-before.json"))}
          after = {e["name"]: e for e in json.load(open("/tmp/env-after.json"))}
          changed_expected = {"AZURE_LEGAL_STORAGE_ACCOUNT", "AZURE_LEGAL_STORAGE_KEY"}
          problems = []
          for name, entry in before.items():
              if name in changed_expected:
                  continue
              if after.get(name) != entry:
                  problems.append(name)
          missing = [n for n in before if n not in after]
          if problems or missing:
              print("REGRESSION DETECTED - unexpected changes:", problems, "missing:", missing)
              raise SystemExit(1)
          print("OK: all", len(before), "prior env vars unaffected outside the 2 intended keys")
          for k in changed_expected:
              print(k, "-> now bound via secretRef" if "secretRef" in json.dumps(after.get(k, {})) else after.get(k))
          PYEOF2
