name: fix-graph-drive-user-final

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot current env array before touching anything
        run: |
          set -euo pipefail
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env_before.json
          echo "Entries before: $(jq 'length' /tmp/env_before.json)"
          echo "Identity before:"
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query identity -o json

      - name: Step 1 - assign a temporary system-assigned managed identity (satisfies the identity-existence validation gate; no Key Vault RBAC needed since we are only removing the secret, not reading it)
        run: |
          set -euo pipefail
          az containerapp identity assign -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --system-assigned

      - name: Step 2 - remove the orphaned, unresolvable graph-drive-user secret
        run: |
          set -euo pipefail
          az containerapp secret remove -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --secret-names graph-drive-user

      - name: Step 3 - set GRAPH_DRIVE_USER as a plain literal value
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --set-env-vars "GRAPH_DRIVE_USER=matthew@innd.com"

      - name: Step 4 - remove the temporary identity again (it was only needed to clear the validation gate)
        run: |
          set -euo pipefail
          az containerapp identity remove -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --system-assigned || \
            echo "identity remove failed or already gone - non-fatal, continuing to verification"

      - name: Regression check - every OTHER key must be byte-for-byte unchanged, and the new value must be correct
        run: |
          set -euo pipefail
          sleep 15
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env_after.json
          echo "Entries after: $(jq 'length' /tmp/env_after.json)"

          NEW_VAL=$(jq -r '.[] | select(.name=="GRAPH_DRIVE_USER") | .value' /tmp/env_after.json)
          if [ "$NEW_VAL" != "matthew@innd.com" ]; then
            echo "FATAL: GRAPH_DRIVE_USER value mismatch, got: $NEW_VAL"
            exit 1
          fi
          echo "GRAPH_DRIVE_USER correctly set to matthew@innd.com"

          jq 'map(select(.name != "GRAPH_DRIVE_USER"))' /tmp/env_before.json > /tmp/before_others.json
          jq 'map(select(.name != "GRAPH_DRIVE_USER"))' /tmp/env_after.json > /tmp/after_others.json
          if ! diff -q <(jq -S . /tmp/before_others.json) <(jq -S . /tmp/after_others.json) > /dev/null; then
            echo "FATAL REGRESSION: some other env var changed. Manual review required."
            diff <(jq -S . /tmp/before_others.json) <(jq -S . /tmp/after_others.json) || true
            exit 1
          fi
          echo "REGRESSION CHECK PASSED: every other env var byte-for-byte unchanged."

          echo "--- OAUTH_CLIENTS specific check ---"
          jq '.[] | select(.name=="OAUTH_CLIENTS")' /tmp/env_after.json

          echo "--- Final identity state (should be back to None or whatever it started as) ---"
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query identity -o json
