name: fix-graph-drive-user-final

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/secret-remove-error

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Attempt secret remove, capture full error to a file
        run: |
          set +e
          mkdir -p diagnostics
          az containerapp secret remove -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --secret-names graph-drive-user > diagnostics/secret-remove-error.md 2>&1
          echo "exit code: $?" >> diagnostics/secret-remove-error.md
          cat diagnostics/secret-remove-error.md
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git add diagnostics/secret-remove-error.md
          git commit -m "chore: capture secret remove error" || true
          git push origin HEAD:diag/secret-remove-error
          exit 0
