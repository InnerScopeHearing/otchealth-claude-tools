# PER-LANE / PER-PLATFORM HEALTH CANARY -- the permanent sensor for a silent gateway break.
#
# skills/platform-canary/platform-canary.mjs asserts, for every gateway lane, that a token mints, that
# the advertised tool count is above that lane's floor (the connector-surface misclassification
# signature: a privileged lane handed ~11 tools instead of ~1000), that the lane is not classified as a
# connector surface, that the gateway resolves it to its own identity, and that brain_search returns
# EXACTLY the room set it should -- expected rooms present, forbidden rooms absent. The forbidden half
# is the load-bearing one: legal-personal and legal-personal-memory are attorney-privileged and the
# personal-legal ring is clo-personal + exec ONLY. It then asserts the shared exec ledger is readable
# AND non-trivial (see below), and finally checks the credential-free platform surfaces: /health's
# registry floor, the unauthenticated front door still answering 401 with its WWW-Authenticate pointer,
# a forged M365 static token still being refused, and both OAuth discovery documents still resolving.
#
# WHY THE LEDGER FLOOR IS NOT OPTIONAL. On 2026-08-17/18 gateway commit c72dd3b read the commons brain
# from bucket otchealth-finance-legal-dr instead of otchealth-brain-dr and found one stray 725-byte
# cto.jsonl, so every lane on every platform saw shared_entry_count=1 while the real ~29-lane history
# sat intact at the correct bucket. HTTP 200, well-formed JSON, no error anywhere in the fleet. A canary
# that asserted only "the ledger responded" would have been green throughout. This one asserts a floor
# on the CONTENT, which is the only thing that catches it.
#
# CADENCE is every 6 hours, not daily (the oauth-clients-canary precedent rather than the nightly-*
# one). A ring widening is a live exposure of privileged personal legal material; a 24h detection
# window for that is too long, and this check is cheap.
#
# EXIT SEMANTICS (see skills/platform-canary/assertions.mjs's exitCode()): 1 = an assertion FAILED,
# something is provably broken; 2 = the canary is BLIND, a check could not run at all; 3 = COVERAGE
# REDUCED, everything checked was healthy but a planned check produced no verdict. All three are
# non-zero and all three page, but they carry different messages because they demand different
# responses. A run that evaluates nothing exits 2, never 0 -- an empty run must never look like a pass.
#
# ROUND 3: the check set is DERIVED, not configured. planChecks() computes every check that MUST produce
# a verdict from lane identity and the registry's structure BEFORE any observation is taken; an absent
# observation becomes a named ERROR for each check it blocked, and assertCoverage() diffs the plan
# against what was actually answered as a structural backstop. No switch on this workflow's command line
# -- and no key in the registry -- can make a check cease to exist; the most it can do is turn that
# check's verdict into a loud, named non-zero one.
#
# ARMING (one-time): the lane half needs fleet credentials, which it resolves through the shared
# kvSecret() chain. With Azure subscription 55c84f6b deleted, that chain reaches the secret store via
# its AWS SSM path, which needs OTC_AWS_ACCESS_KEY_ID / OTC_AWS_SECRET_ACCESS_KEY as repo secrets.
#
# UNARMED RUNS NOW FAIL LOUDLY (exit 3, COVERAGE REDUCED) INSTEAD OF REPORTING OK. Round 1 appended
# '--lanes __unarmed__ --no-ledger' when those two secrets were absent, so no lane matched the filter,
# the ledger block was dropped, and the run evaluated only the five credential-free platform surfaces
# and exited 0. As scheduled, this workflow would have reported OK every six hours while checking
# NEITHER a lane, NOR a ring, NOR the ledger -- the exact failure class it was built to detect, wearing
# a green light. That was a worse outcome than an alert storm: an alert storm is annoying, a monitor
# that manufactures confidence is dangerous.
#
# So the filter is gone. The canary runs its full check set; required lanes without a credential report
# ERROR (blind, exit 2) and the coverage floor reports REDUCED (exit 3), each with its own message. This
# WILL page every 6 hours until the two secrets are provisioned. That is deliberate and it is the
# correct trade: the alternative is a permanently green canary that watches nothing. If the noise is
# genuinely unacceptable before the secrets land, DISABLE the schedule -- an absent canary is at least
# honestly absent, and a disabled workflow is visible in the Actions tab, whereas a green one that
# checked nothing is not. (The heartbeat step at the bottom would normally be what notices a silent cron,
# but it does not currently work; see its own note.) Do NOT re-introduce a filter that turns "checked
# nothing" back into "OK".
name: Platform Canary (per-lane + per-platform)

on:
  schedule:
    - cron: '25 */6 * * *'   # every 6h at :25, offset from oauth-clients-canary's ':17 */6'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Run report-only (always exit 0). Use for a safe manual look without paging.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: platform-canary
  cancel-in-progress: false

jobs:
  platform-canary:
    name: per-lane + per-platform health canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: "Create the run log up front (so the page step can never reference a file that does not exist)"
        # GAP 5, the page path. Every later step appends to this file, and the page step below is
        # `if: failure()` -- which fires when the UNIT-TEST step fails too, i.e. before the canary has
        # written anything. Round 1 would have handed page-on-failure.mjs a path that did not exist.
        # Creating it here means the page always has something to attach, even if that something is
        # only the header line plus the unit-test output.
        run: |
          printf '[platform-canary] run %s started %s\n' "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" > "${GITHUB_WORKSPACE}/platform-canary.log"

      - name: Unit-test the assertion core before trusting its verdict
        # A canary whose own classifier has regressed is worse than no canary: it would report green
        # from broken logic. The incident fixture (shared_entry_count=1) is a permanent regression lock
        # in this suite, so this step failing means the canary can no longer detect the 2026-08-17/18
        # failure class and its verdict below must not be believed.
        run: |
          set -o pipefail
          node --test tests/platform-canary.test.mjs 2>&1 | tee -a "${GITHUB_WORKSPACE}/platform-canary.log"

      - name: Run the canary
        working-directory: skills/platform-canary
        env:
          # Fleet secret store, reached through kvSecret()'s AWS SSM path. Values are consumed by the
          # resolver and are never printed, never written to a file, and never appear in a verdict.
          OTC_AWS_ACCESS_KEY_ID: ${{ secrets.OTC_AWS_ACCESS_KEY_ID }}
          OTC_AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          # Off-Azure PostHog credential: setup/page-on-failure.mjs prefers this env var over the secret
          # store, so paging does not itself depend on the store this canary may be reporting as broken.
          POSTHOG_FLEET_INGEST_KEY: ${{ secrets.POSTHOG_FLEET_INGEST_KEY }}
          REPORT_ONLY: ${{ inputs.report_only }}
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code would be tee's, not the canary's, and this gate could never fail.
          ARGS="--json"
          if [ "${REPORT_ONLY}" = "true" ]; then ARGS="$ARGS --report"; fi
          if [ -z "${OTC_AWS_ACCESS_KEY_ID:-}" ] || [ -z "${OTC_AWS_SECRET_ACCESS_KEY:-}" ]; then
            # WARN, but DO NOT narrow the run. See the ARMING note in this file's header: narrowing is
            # what made an unarmed run look healthy. The canary itself now reports the reduced coverage
            # as its own non-zero outcome, which is the whole point of the change.
            echo "::warning::[platform-canary] LANE COVERAGE IS UNARMED: OTC_AWS_ACCESS_KEY_ID/OTC_AWS_SECRET_ACCESS_KEY are not set as repo secrets, so no lane credential can be resolved. The run below is EXPECTED to exit non-zero (2 = blind on every lane, and/or 3 = coverage reduced). It is NOT narrowed to the platform half: a narrowed run would exit 0 and report OK while watching neither a lane, nor the personal-legal ring, nor the shared ledger."
          fi
          node platform-canary.mjs $ARGS 2>&1 | tee -a "${GITHUB_WORKSPACE}/platform-canary.log"

      - name: Upload canary log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-canary-log
          path: platform-canary.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (email, PostHog fallback)
        if: failure()
        env:
          POSTHOG_FLEET_INGEST_KEY: ${{ secrets.POSTHOG_FLEET_INGEST_KEY }}
        run: |
          LOG="${GITHUB_WORKSPACE}/platform-canary.log"
          # Belt and braces: the step above creates this file, but a page must never itself fail for
          # want of a log. A page that dies because its evidence is missing is a silent page.
          [ -s "$LOG" ] || printf '[platform-canary] no log was produced; the run failed before writing one.\n' > "$LOG"
          node setup/page-on-failure.mjs --workflow "Platform Canary" --log "$LOG"

      # Schedule-liveness heartbeat. INTENT: this beat means "this workflow's cron fired at all", a
      # different failure class from the verdict above -- a workflow that never runs never gets the
      # chance to go red, so without a liveness signal, the canary silently ceasing to exist looks
      # exactly like a healthy fleet. The matching kind:"nightly-workflow" entry exists in
      # setup/heartbeat-registry.json and skills/nightly-schedule-canary/schedule-canary.mjs would read
      # it.
      #
      # HONEST STATUS: THIS BEAT DOES NOT CURRENTLY WORK, AND SO THIS CANARY IS *NOT* SELF-MONITORED.
      # Round 1 claimed "the monitor is thereby itself monitored". That claim was false. setup/heartbeat.mjs
      # writes EXCLUSIVELY to Azure Blob (`https://<acct>.blob.core.windows.net/...`), resolving
      # azure-commons-storage-account/-key from Key Vault -- and that Azure subscription is deleted, so
      # the credential read fails and the script exits 78 before writing anything. schedule-canary.mjs
      # reads the same dead store. The `|| true` below then swallows it, which is why the breakage is
      # invisible. The step is KEPT (it is harmless and it arms itself the moment a working heartbeat
      # backend exists) but the claim is removed rather than left standing: an untrue comment asserting
      # that something is monitored is worse than no monitoring at all, because it stops anyone looking.
      # TO ACTUALLY CLOSE THIS: port setup/heartbeat.mjs's storage layer to S3 (the same move the rest of
      # the estate already made), then restore the self-monitoring claim -- and not before.
      - name: "Heartbeat: mark this workflow's schedule as alive (CURRENTLY A NO-OP -- see the note above)"
        if: always()
        continue-on-error: true
        env:
          OTC_AWS_ACCESS_KEY_ID: ${{ secrets.OTC_AWS_ACCESS_KEY_ID }}
          OTC_AWS_SECRET_ACCESS_KEY: ${{ secrets.OTC_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: node setup/heartbeat.mjs beat platform-canary ok >/dev/null 2>&1 || true
