name: fix-developer-oauth-lane

# Root-cause repair for provision-developer-oauth-lane.yml's failure (run 28806975346): the write to
# OAUTH_CLIENTS succeeded at the Container App TEMPLATE level (confirmed by the read-back regression
# check passing), but the new developer client still couldn't mint a token. Leading hypothesis: the
# gateway runs in multi-revision mode (required for its own blue-green deploy pipeline) and a plain
# `az containerapp update` does not guarantee 100% traffic cutover to the newly-created revision — so
# the OLD revision (without the developer entry) may still have been serving live traffic. Secondary
# hardening: use compact (jq -c) JSON everywhere embedded in --set-env-vars, and clean up any stale
# "developer" entries left over from the failed run before adding a fresh one, instead of assuming
# none exist.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Diagnose revision mode and current traffic split
        run: |
          set -euo pipefail
          echo "--- Revision mode ---"
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.configuration.activeRevisionsMode" -o tsv
          echo "--- Revisions and traffic weights ---"
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight, createdTime:properties.createdTime}" -o table

      - name: Read current OAUTH_CLIENTS and remove any stale developer entries
        id: clean
        run: |
          set -euo pipefail
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env[?name=='OAUTH_CLIENTS'].value | [0]" \
            -o tsv > current_oauth_clients.json
          echo "Current entry count: $(jq 'length' current_oauth_clients.json)"
          STALE_COUNT=$(jq '[.[] | select(.agent == "developer")] | length' current_oauth_clients.json)
          echo "Stale developer entries found: $STALE_COUNT (will be removed before re-adding one clean entry)"
          jq -c '[.[] | select(.agent != "developer")]' current_oauth_clients.json > cleaned_oauth_clients.json
          echo "cleaned_count=$(jq 'length' cleaned_oauth_clients.json)" >> "$GITHUB_OUTPUT"

      - name: Generate fresh developer client credentials and merge (compact JSON)
        run: |
          set -euo pipefail
          SUFFIX=$(openssl rand -hex 4)
          CLIENT_ID="oc_developer_${SUFFIX}"
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          jq -c --arg cid "$CLIENT_ID" --arg sec "$SECRET" \
            '. + [{"client_id": $cid, "secret": $sec, "agent": "developer"}]' \
            cleaned_oauth_clients.json > merged_oauth_clients.json
          # Validate the merged output is valid, single-line JSON before going anywhere near production.
          jq empty merged_oauth_clients.json
          echo "Merged JSON byte length: $(wc -c < merged_oauth_clients.json)"
          echo "$SECRET" > secret.txt
          echo "$CLIENT_ID" > client_id.txt

      - name: Apply cleaned + merged OAUTH_CLIENTS to the live gateway
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --set-env-vars OAUTH_CLIENTS="$(cat merged_oauth_clients.json)"

      - name: Force 100% traffic to the latest revision (in case multi-revision mode held back the old one)
        run: |
          set -euo pipefail
          LATEST=$(az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "Latest revision: $LATEST"
          az containerapp ingress traffic set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --revision-weight "${LATEST}=100" || \
            echo "traffic set command failed or not applicable (may already be single-revision mode with auto-100%) — continuing to verification."
          echo "--- Post-cutover revision state ---"
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight}" -o table

      - name: Write Key Vault secrets
        run: |
          set -euo pipefail
          az keyvault secret set --vault-name kv-otc-55c84f6bef --name oauth-lane-developer-id \
            --value "$(cat client_id.txt)" -o none
          az keyvault secret set --vault-name kv-otc-55c84f6bef --name oauth-lane-developer-secret \
            --value "$(cat secret.txt)" -o none

      - name: Verify new developer lane mints a token (retry over 2 minutes to rule out propagation delay)
        run: |
          set -euo pipefail
          CID=$(cat client_id.txt)
          SEC=$(cat secret.txt)
          for i in 1 2 3 4 5 6 7 8; do
            RESP=$(curl -s -X POST https://mcp.otchealth.app/oauth/token \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=client_credentials&client_id=${CID}&client_secret=${SEC}")
            HAS_TOKEN=$(echo "$RESP" | jq -e '.access_token != null' 2>/dev/null || echo "false")
            if [ "$HAS_TOKEN" = "true" ]; then
              echo "SUCCESS on attempt $i: developer lane token mint works."
              exit 0
            fi
            echo "Attempt $i failed: $(echo "$RESP" | jq -c 'del(.access_token)' 2>/dev/null || echo "$RESP")"
            sleep 15
          done
          echo "FATAL: still failing after 8 attempts (120s) even after explicit traffic cutover. Root cause is NOT revision-traffic-lag. Needs a fresh diagnosis — do not retry blindly again."
          exit 1

      - name: Regression check
        if: always()
        run: |
          set -euo pipefail
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env[?name=='OAUTH_CLIENTS'].value | [0]" \
            -o tsv > post.json
          echo "Post-fix entries (client_id/agent only):"
          jq -c '[.[] | {client_id, agent}]' post.json
          DEV_COUNT=$(jq '[.[] | select(.agent == "developer")] | length' post.json)
          echo "Developer entries now: $DEV_COUNT (should be exactly 1)"
