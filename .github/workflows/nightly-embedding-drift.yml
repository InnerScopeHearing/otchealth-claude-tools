# Nightly Embedding Drift Monitor — scheduled recall-quality trend for the memory indexes (REPORT-ONLY).
#
# Azure GenAIOps #13 ("Phoenix") pattern, cost-neutral on our stack: samples canned probe queries
# (skills/embedding-drift-monitor/probes.json) against each Azure AI Search memory index (memory-exec,
# the per-ring private indexes, any commons-<agent>-memory index), records top-score/coverage, compares
# to the recorded baseline (drift-baseline.json), and emits embedding_drift events to PostHog so the
# trend lives next to eval_result. Mirrors nightly-eval.yml's shape exactly: never blocks anything —
# drift.mjs always exits 0 (this answers "is memory recall degrading", a monitor question, not a gate).
#
# Azure auth = SECRETLESS OIDC (2026-07-13): drift.mjs resolves every service secret from Azure Key
# Vault kv-otc-55c84f6bef via kvSecret(). claude-tools CI authenticates to Azure with federated OIDC
# (azure/login + repo VARIABLES AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID + id-token: write), the same
# pattern verify-get-secret-migration.yml uses; the repo deliberately does NOT set AZURE_SP_* secrets
# (no client secret at rest). kvSecret()'s az-CLI/OIDC path (added 2026-07-13) mints the KV token from
# the az login this step establishes. History: GCP retired -> this workflow first wired the dead
# GCP_CLAUDE_DRIVER_SA_JSON (silently dead), then AZURE_SP_* secrets that this repo never sets (still
# dead, PostHog 493944 had zero events) -> now OIDC. Regression-ledger tag: monitor-azure-auth-oidc.
name: Nightly Embedding Drift Monitor

on:
  schedule:
    - cron: '45 6 * * *'   # daily 06:45 UTC, just after nightly-eval.yml's 06:30 UTC run
  workflow_dispatch: {}     # manual trigger for testing

permissions:
  id-token: write   # secretless OIDC login to Azure (azure/login); no AZURE_SP_* secret at rest
  contents: read

concurrency:
  group: nightly-embedding-drift
  cancel-in-progress: false

jobs:
  drift:
    name: memory-index recall drift (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless — the claude-tools Azure auth pattern)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Probe memory indexes + emit to PostHog (report-only; never fails)
        continue-on-error: true
        run: |
          node skills/embedding-drift-monitor/drift.mjs --emit --json "${GITHUB_WORKSPACE}/drift-report.json" 2>&1 | tee "${GITHUB_WORKSPACE}/drift.log"

      - name: Upload drift report + log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedding-drift-report
          path: |
            drift-report.json
            drift.log
          retention-days: 90
          if-no-files-found: warn
