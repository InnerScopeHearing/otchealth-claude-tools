# Windows PowerShell 5.1 proof for the PC setup script (setup/pc/setup-aws-agent-toolkit.ps1).
#
# The script is written for Windows PowerShell 5.1, the PowerShell that is built into Windows, because that is the one
# Matt's PC runs when he right-clicks the file and chooses "Run with PowerShell". It was developed on a Linux machine
# with PowerShell 7, which cannot show how 5.1 behaves. This job runs the SAME automated tests in the real thing:
# a Windows machine, the 5.1 parser, `shell: powershell` (that is Windows PowerShell 5.1; `pwsh` would be PowerShell 7).
#
# What it runs: the real 5.1 parser over every .ps1 in setup/pc, then setup/pc/tests/Run-Tests.ps1 (ten test files:
# syntax and compatibility checks, the TOML/JSON/marker editors, the whole script against a pretend PC, the low level
# helpers with real programs and real files, the script run as a file, and two seeded randomized checks against Python).
# The real setup never runs here: nothing is installed, nobody signs in, nothing leaves the machine.
#
# No secrets are used. SHA-pinned actions per the supply-chain policy; read-only token.
name: pc-toolkit-ps51

on:
  pull_request:
    paths:
      - 'setup/pc/**'
      - '.github/workflows/pc-toolkit-ps51.yml'

permissions:
  contents: read

jobs:
  windows-powershell-5-1:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # The files must arrive byte for byte as committed (LF line endings). Git for Windows would otherwise
      # turn them into CRLF while checking out, and the script's own hash checks and tests would see different files.
      - name: Keep line endings exactly as committed
        shell: powershell
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Show the machine and the PowerShell that runs the next steps
        shell: powershell
        run: |
          $PSVersionTable | Out-String
          'Windows: ' + [Environment]::OSVersion.VersionString
          'Edition:  ' + $PSVersionTable.PSEdition + ', version ' + $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'This job must run in Windows PowerShell 5.1.' }
          foreach ($n in @('python', 'python3', 'py')) {
            $c = Get-Command $n -All -CommandType Application -ErrorAction SilentlyContinue
            foreach ($x in @($c)) { 'found ' + $n + ' at ' + $x.Source }
          }

      - name: Parser check (the real Windows PowerShell 5.1 parser, every .ps1 under setup/pc)
        shell: powershell
        run: |
          $bad = 0
          $count = 0
          foreach ($f in @(Get-ChildItem -LiteralPath 'setup/pc' -Recurse -Filter '*.ps1')) {
            $errs = $null
            $toks = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$toks, [ref]$errs)
            $count++
            if (@($errs).Count -gt 0) {
              $bad++
              foreach ($e in @($errs)) { ('{0}:{1}: {2}' -f $f.FullName, $e.Extent.StartLineNumber, $e.Message) }
            }
            else { 'parsed with zero errors: ' + $f.Name }
          }
          if ($count -eq 0) { throw 'no .ps1 files found under setup/pc' }
          if ($bad -gt 0) { throw ($bad.ToString() + ' file(s) did not parse') }

      - name: Run the tests in Windows PowerShell 5.1
        shell: powershell
        env:
          W3_REQUIRE_PYTHON: '1'
        run: |
          & ./setup/pc/tests/Run-Tests.ps1
          exit $LASTEXITCODE
