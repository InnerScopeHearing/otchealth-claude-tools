# THE SILENCE MONITOR: a registered job that goes quiet must page someone.
#
# Re-armed 2026-10-07 on AWS OIDC (it was the Azure fleet-sentinels workflow, schedule disarmed 2026-08-27).
# One checker, skills/nightly-schedule-canary/schedule-canary.mjs, judges the AGE of every registered job's
# proof of life (setup/heartbeat-registry.json) against its cadence: the heartbeat store via
# setup/heartbeat.mjs, plus the GitHub Actions schedule history for rows carrying "gh_workflow". Stale,
# never-ran, failing, unwitnessed and unreadable jobs make it exit 1 (--strict), and the page step below opens or
# comments on the [FLEET-ALERT] nightly-fleet-sentinels issue through setup/page-on-failure.mjs, mentioning the
# owner. PAGE_GITHUB_MENTION defaults to @GBGolfMatt; the at sign matters, because setup/alert-issue.mjs's
# parseMentions drops a bare login without a word and nobody would be notified.
#
# A monitor cannot watch its own silence, so .github/workflows/sentinel-watchdog.yml does: it pages when this
# workflow has not completed a run for 26 hours, and this checker in turn watches the watchdog (registry row
# "sentinel-watchdog").
#
# Reading the heartbeat store needs, for the assumed role: s3:ListBucket on the commons bucket (prefix
# condition on the _HEARTBEAT/ folder) and s3:GetObject on that folder. If it lacks them the monitor says so
# and pages; it never passes silently. Rows that live in another repo need NO new token: they are read with
# this job's own GITHUB_TOKEN and then anonymously, which answers for a public repo (otchealth-mcp-server). A
# private repo (otchealth-cto) is witnessed by the job's own beat instead, and a row neither witness can see is
# reported UNWITNESSED with the fix named, never skipped. The repo secret FLEET_WATCH_GH_TOKEN (read-only,
# Actions: read) stays an OPTIONAL fallback and is never required.
name: Nightly Fleet Sentinels

on:
  schedule:
    - cron: '20 5 * * *'   # daily 05:20 UTC; GitHub starts scheduled runs hours late, the registry limits allow for it
  workflow_dispatch: {}

permissions:
  id-token: write   # secretless AWS OIDC, to read the heartbeat store
  contents: read
  actions: read     # workflow-run history of the watched workflows in this repo (GITHUB_TOKEN)
  issues: write     # the pager: setup/page-on-failure.mjs --github-issue

concurrency:
  group: nightly-fleet-sentinels
  cancel-in-progress: false

jobs:
  silence-monitor:
    name: heartbeat age against cadence, every registered job
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # continue-on-error: if the role cannot be assumed the monitor still runs, reports the beat store as
      # unreadable with the reason, and pages. The GitHub-witnessed rows are judged either way.
      - name: Configure AWS credentials (OIDC, secretless, read-only role)
        id: aws
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_FLEET_SENTINELS_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-aws-dr-canary' }}
          aws-region: us-east-1

      - name: "Silence monitor: heartbeat age against cadence (--strict pages on any anomaly)"
        id: monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FLEET_WATCH_GH_TOKEN: ${{ secrets.FLEET_WATCH_GH_TOKEN }}
          FLEET_SENTINELS_ROLE_ARN: ${{ vars.AWS_FLEET_SENTINELS_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-aws-dr-canary' }}
          AWS_REGION: us-east-1
        run: |
          set -o pipefail   # a pipeline's exit code is tee's unless pipefail is set: without this line the monitor cannot fail
          timeout 300 node skills/nightly-schedule-canary/schedule-canary.mjs --strict 2>&1 | tee "${GITHUB_WORKSPACE}/silence-monitor.log"

      - name: Upload monitor log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: silence-monitor-log
          path: silence-monitor.log
          retention-days: 90
          if-no-files-found: warn

      - name: Page on failure (GitHub issue, email and PostHog fallback)
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_FLEET_INGEST_KEY: ${{ secrets.POSTHOG_FLEET_INGEST_KEY }}
          PAGE_GITHUB_MENTION: ${{ vars.FLEET_ALERT_MENTION || '@GBGolfMatt' }}
          PAGE_STEP_OUTCOMES: "aws=${{ steps.aws.outcome }} monitor=${{ steps.monitor.outcome }}"
        run: timeout 120 node setup/page-on-failure.mjs --workflow "Nightly Fleet Sentinels" --github-issue "[FLEET-ALERT] nightly-fleet-sentinels" --tail-lines 120 --log "${GITHUB_WORKSPACE}/silence-monitor.log"
