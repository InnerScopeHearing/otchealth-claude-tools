name: verify-doc-indexer-ocr-image
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Merged 40-character toolkit commit'
        required: true
      image_digest:
        description: 'Immutable doc-indexer index digest'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: verify-doc-indexer-ocr-${{ github.run_id }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947
      - name: Verify immutable OCR bytes on both platforms
        env:
          SOURCE: ${{ inputs.source_commit }}
          INDEX: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]] && [[ "$INDEX" =~ ^sha256:[a-f0-9]{64}$ ]]
          git show-ref --verify --quiet refs/remotes/origin/main
          git merge-base --is-ancestor "$SOURCE" origin/main
          aws ecr batch-get-image --repository-name doc-indexer --image-ids imageDigest="$INDEX" --query 'images[0].imageManifest' --output text > /tmp/index.json
          for platform in amd64 arm64; do
            digest=$(jq -er --arg platform "$platform" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $platform)] | if length == 1 then .[0].digest else error("missing platform") end' /tmp/index.json)
            node tools/ocr-image-proof/verify.mjs "$GITHUB_WORKSPACE" "$SOURCE" "$digest" "linux/$platform" > "ocr-image-proof-$platform.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cfo-ocr-image-byte-proof
          path: ocr-image-proof-*.json
          if-no-files-found: error
