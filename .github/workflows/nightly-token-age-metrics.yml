# Nightly rotating-token-age metric emitter (2026-08-18).
#
# skills/token-keeper/token-age-metrics.mjs emits otc.fleet.token_age_hours{secret:<name>}, closing
# the Datadog monitor "Credential health — rotating token aging toward idle-expiry" (id 22896070,
# max(last_2d):max:otc.fleet.token_age_hours{*} by {secret} > 1200), which has shown "No Data" since
# it was created 2026-06-27 because nothing in the codebase ever emitted this metric (a repo-wide grep
# confirmed zero hits before this workflow was added). A monitor watching a metric nobody emits looks
# like healthy silence, which is worse than no monitor at all — this is the fix.
#
# WHY A NEW WORKFLOW, NOT an existing job: unlike otc.fleet.agent_error (which rides the ALREADY
# scheduled fleet-medic job, see medic.mjs's emitAgentErrorMetrics), token-age-metrics.mjs has no
# existing scheduled job to piggyback on — token-keeper's own daily rotation job lives entirely as a
# live, uncommitted Azure Container App Job spec (no script in this repo to safely extend without
# risking the fleet's actual token rotation), so a dedicated workflow is the safe, in-repo mechanism.
#
# AUTH: GitHub OIDC -> arn:aws:iam::900915535335:role/otchealth-token-age-metrics, the same pattern
# nightly-secrets-dr-export.yml and nightly-aws-dr-canary.yml use. No long-lived key is stored.
#
# CORRECTED 2026-09-02, BEFORE THIS WORKFLOW EVER RAN. It was authored 2026-08-18 against
# AZURE_SP_CLIENT_ID/CLIENT_SECRET/TENANT_ID, on the reasoning that kvSecret() would resolve secrets
# through its Azure SP fallback and then bridge Key Vault's aws-cto-access-key-id/-secret into real
# AWS credentials. Azure subscription 55c84f6b -- and Key Vault kv-otc-55c84f6bef with it -- was
# PERMANENTLY DELETED on 2026-08-13, five days before that was written, and kvSecret() has since
# defaulted to SECRET_BACKEND=ssm. So the original chain was circular on a bare runner: reach SSM by
# first reading the AWS credentials out of SSM. ensureAwsCreds() would have returned false, the
# script would have exited 1 (correctly and loudly, by its own design), and this workflow would have
# paged every morning at 09:05 while otc.fleet.token_age_hours stayed at No Data -- fixing the
# monitor's silence with a different kind of silence. Assuming the role directly removes the loop.
#
# LEAST PRIVILEGE: the role can ssm:GetParameter ONLY the five allowlisted rotating secrets (metadata
# is all this script reads from them -- ssmParamModifiedMs passes WithDecryption:false) plus the two
# datadog-* parameters it needs to actually submit the metric, and kms:Decrypt only via SSM. No write
# of any kind.
name: Nightly Token Age Metrics

on:
  schedule:
    - cron: '5 9 * * *'   # daily 09:05 UTC (after the 08:xx nightly-canary cluster, before the 09:xx family)
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # GitHub OIDC -> AssumeRoleWithWebIdentity; no long-lived AWS key stored anywhere

concurrency:
  group: nightly-token-age-metrics
  cancel-in-progress: false

jobs:
  token-age-metrics:
    name: emit otc.fleet.token_age_hours
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_TOKEN_AGE_METRICS_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-token-age-metrics' }}
          aws-region: us-east-1

      - name: "Run token-age-metrics (fails RED on any real submission failure -- see the script's own header for why that is loud by design)"
        working-directory: skills/token-keeper
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code is tee's, not the command's. Without this line this job CANNOT FAIL.
          node token-age-metrics.mjs --json 2>&1 | tee "${GITHUB_WORKSPACE}/token-age-metrics.log"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: token-age-metrics-log
          path: token-age-metrics.log
          retention-days: 90
          if-no-files-found: warn

      # A real submission failure (or "cannot reach SSM at all") already makes token-age-metrics.mjs
      # exit non-zero, which fails the step above -- route that RED through the same pager every other
      # nightly monitor in this repo uses, rather than leaving it visible only to someone watching the
      # Actions tab.
      - name: Page on failure (email, PostHog fallback)
        if: failure()
        run: node setup/page-on-failure.mjs --workflow "Nightly Token Age Metrics" --log "${GITHUB_WORKSPACE}/token-age-metrics.log"

      # Schedule-liveness heartbeat, a DIFFERENT failure class than the emit-failure verdict above.
      # Fires unconditionally (if: always()), because this beat means "this workflow's own cron fired
      # today", not "every metric it tried to send actually landed" (that already pages via the step
      # above). See skills/nightly-schedule-canary/SKILL.md for the full design; mirrors every other
      # nightly-*.yml workflow's own heartbeat step and setup/heartbeat-registry.json's
      # nightly-token-age-metrics entry.
      - name: "Heartbeat: mark this workflow's schedule as alive (independent of the emit verdict above)"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-token-age-metrics ok >/dev/null 2>&1 || true
