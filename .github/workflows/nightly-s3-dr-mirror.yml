# Nightly S3 off-Azure DR mirror (Wave 4, AI-OS reconciled plan item 4.4).
#
# skills/fleet-backup/s3-mirror.mjs replicates everything skills/fleet-backup/backup.mjs writes to the
# Azure Blob container `ledger-backup` into AWS S3, an off-Azure cold copy: a total loss of the Azure
# subscription or tenant should not also mean a total loss of the only durable copy of the Cosmos work
# ledger and the live AI Search room dumps. The script and its README have existed since the Phase 6
# build, but nothing had ever SCHEDULED it (no Container Apps Job, no GitHub Actions workflow), and the
# base non-privileged aws-dr-* credential set was independently confirmed LIVE in Key Vault
# kv-otc-55c84f6bef in this same reconciliation pass (a real STS GetCallerIdentity call and a real S3
# ListObjectsV2 call both succeeded). This item was a schedule gap, not a credential gap, and this
# workflow is the fix. See skills/fleet-backup/s3-mirror.mjs's header and README.md "S3 DR mirror
# (Phase 6)" for the full design: ring segregation (privileged rooms excluded from this bucket by
# default), idempotent skip-if-unchanged, inert-safe fail-open if a secret ever goes missing again.
#
# This workflow runs the mirror, THEN skills/fleet-backup/restore-drill.mjs against that same run's
# manifest, so every scheduled run proves the backup is actually RESTORABLE (bytes round-trip, sha256
# matches), not merely writable. Non-privileged lane only, the safe default posture; the two privileged
# lanes (--include-personal-legal + S3_DR_INCLUDE_PERSONAL_LEGAL=1, and --include-finance-legal +
# S3_DR_INCLUDE_FINANCE_LEGAL=1 -- see s3-mirror.mjs's 2026-08-04 two-lane split) each stay a
# deliberate, manual, double-opt-in action and are never scheduled here.
#
# Azure auth here is TWO-PART, unlike the other nightly-*.yml monitors in this repo:
#   1. azure/login OIDC (vars.AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID, id-token: write, no secret at
#      rest) authenticates the az CLI session, which is what lets kvSecret() (skills/kb-memory/
#      azure-secret.mjs) resolve the aws-dr-* secrets from Key Vault via its az-CLI/OIDC fallback path,
#      the same secretless pattern nightly-azure-canary.yml and nightly-recall-eval.yml already use.
#   2. skills/fleet-backup/azure-blob-client.mjs, the client s3-mirror.mjs and restore-drill.mjs use to
#      read the SOURCE ledger-backup container, is narrower than kvSecret(): it only supports a
#      Container Apps managed identity (not present on a GitHub-hosted runner) or an AZURE_SP_*
#      client_credentials fallback. It has no az-CLI/OIDC path. So this workflow ALSO sets
#      AZURE_SP_CLIENT_ID/CLIENT_SECRET/TENANT_ID from the same GitHub Actions secrets
#      verify-get-secret-migration.yml and provision-ring-memory-job.yml already use, on the run steps
#      that touch Azure Blob. This exactly matches the README's own documented ad-hoc fallback ("run
#      with AZURE_SP_* env set"); skipping it would leave step 1's OIDC login unable to reach the
#      source container by itself.
name: Nightly S3 DR Mirror

on:
  schedule:
    - cron: '50 6 * * *'   # daily 06:50 UTC, after backup.mjs's own 06:00 UTC Container Apps Job run, ahead of the 08:00 medic
  workflow_dispatch: {}     # manual trigger; use this for the first real proving run after merge

permissions:
  id-token: write   # secretless OIDC login to Azure (azure/login); kvSecret reads the aws-dr-* Key Vault secrets via the az session
  contents: read

concurrency:
  group: nightly-s3-dr-mirror
  cancel-in-progress: false

jobs:
  s3-dr-mirror:
    name: off-Azure S3 mirror + restore-drill proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless -- lets kvSecret resolve the aws-dr-* Key Vault secrets)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Run S3 DR mirror (non-privileged lane only; the privileged lane stays a deliberate manual double opt-in, never scheduled)"
        working-directory: skills/fleet-backup
        env:
          BACKUP_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT || 'stotc55c84f6bef' }}
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code is tee's, not the command's. Without this line this job CANNOT FAIL.
          node s3-mirror.mjs run 2>&1 | tee "${GITHUB_WORKSPACE}/s3-dr-mirror.log"

      - name: "Run restore drill (proves the mirror is actually restorable, not merely writable)"
        if: always()
        working-directory: skills/fleet-backup
        env:
          BACKUP_STORAGE_ACCOUNT: ${{ vars.BACKUP_STORAGE_ACCOUNT || 'stotc55c84f6bef' }}
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -o pipefail
          node restore-drill.mjs 2>&1 | tee "${GITHUB_WORKSPACE}/s3-restore-drill.log"

      - name: Upload mirror log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-dr-mirror-log
          path: s3-dr-mirror.log
          retention-days: 90
          if-no-files-found: warn

      - name: Upload restore-drill log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: s3-restore-drill-log
          path: s3-restore-drill.log
          retention-days: 90
          if-no-files-found: warn

      # Either step above failing (a bad mirror run, or a restore that does not round-trip) fails this
      # job. A RED job is not a page on its own -- route it through the real pager (dual email + PostHog
      # fallback), matching every other nightly-*.yml monitor. Both logs are attached so the page shows
      # whichever step actually failed, not just the first one.
      - name: Page on failure (email, PostHog fallback)
        if: failure()
        run: node setup/page-on-failure.mjs --workflow "Nightly S3 DR Mirror" --log "${GITHUB_WORKSPACE}/s3-dr-mirror.log" --log "${GITHUB_WORKSPACE}/s3-restore-drill.log"

      # Schedule-liveness heartbeat, a DIFFERENT failure class than the mirror/drill verdict above. Fires
      # unconditionally (if: always()) because this beat means "this workflow's own cron fired today",
      # not "the mirror/drill content was healthy" (that already pages via the step above). See
      # skills/nightly-schedule-canary/SKILL.md for the full design; this mirrors every other
      # nightly-*.yml workflow's own heartbeat step.
      - name: "Heartbeat: mark this workflow's schedule as alive (independent of the mirror/drill verdict above)"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-s3-dr-mirror ok >/dev/null 2>&1 || true
