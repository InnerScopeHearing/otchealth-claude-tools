# RETIRED 2026-10-09 (security finding S-03). This file is a disarmed stub. Do not restore the old body.
#
# What it was: a reusable workflow (workflow_call plus workflow_dispatch) meant to let a golden-task eval
# baseline gate a deploy, report-only until a flag was flipped.
#
# Why it is gone: its only cloud login was Azure, which was permanently deleted on 2026-08-13. Nothing ever
# called it: this repo has no deploy step, and otchealth-mcp-server considered it and rejected it, because a
# cross-repo call checks out the caller repo and not this one. It has no recorded run. It was also an
# injection path. The tolerance input (a free-text string under workflow_dispatch) and the agent input (under
# workflow_call) were pasted straight into shell lines in a job that held id-token: write.
#
# What it does now: nothing. No inputs, no permissions, no secrets, no cloud login. It no longer declares
# workflow_call, so a stale uses: reference fails at parse time instead of running. Dispatching it fails on
# purpose.
#
# Where to go instead: .github/workflows/nightly-eval.yml runs the same eval-gate.mjs comparison, report only,
# with AWS auth. A real deploy gate, if one is wanted later, should be a new workflow that passes inputs
# through env: and asks for id-token only in a job that assumes a role.
#
# Last working version: commit b5e808756967040b8caac2487fddf021760ab331.
#
# tests/workflow-input-injection.test.mjs keeps this file a stub.
name: Deploy Eval Gate (reusable)

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: retired
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on purpose
        run: |
          echo "Retired: Azure was deleted on 2026-08-13; see .github/workflows/nightly-eval.yml (same eval gate, report only, AWS auth)"
          echo "::error title=deploy-eval-gate is retired::Azure was deleted on 2026-08-13; see .github/workflows/nightly-eval.yml (same eval gate, report only, AWS auth)"
          exit 1
