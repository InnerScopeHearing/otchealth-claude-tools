name: diag-env-state

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main explicitly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current env, secret presence, and attempt a dry secret remove to see live error
        run: |
          set +e
          APP=otchealth-mcp-gateway
          RG=rg-otchealth-apps-prod

          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env.json 2>/tmp/env_err.txt
          echo "env exit: $?"
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets" -o json > /tmp/secrets.json 2>/tmp/secrets_err.txt
          echo "secrets exit: $?"

          # Does graph-drive-user secret still exist?
          GDU_SECRET=$(jq -r '.[] | select(.name=="graph-drive-user") | .name' /tmp/secrets.json 2>/dev/null)
          echo "graph-drive-user secret present: [$GDU_SECRET]"

          # Does GRAPH_DRIVE_USER env var exist and what is its shape?
          jq '.[] | select(.name=="GRAPH_DRIVE_USER")' /tmp/env.json > /tmp/gdu_env.json 2>/dev/null
          echo "GRAPH_DRIVE_USER env entry:"
          cat /tmp/gdu_env.json

          # Live reproduction: attempt a harmless no-op update to see the exact current error (revision provisioning)
          az containerapp update -n "$APP" -g "$RG" --revision-suffix "diagprobe$(date +%s)" > /tmp/probe.txt 2>&1
          echo "probe exit: $?"

          set -euo pipefail
          BR="diag/env-state"
          OUT="diagnostics/env-state.md"
          mkdir -p diagnostics
          {
            echo "# Env + secret state diagnostic"
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## env count"
            echo '```'; jq 'length' /tmp/env.json; echo '```'
            echo "## graph-drive-user secret present?"
            echo '```'; echo "[$GDU_SECRET]"; echo '```'
            echo "## GRAPH_DRIVE_USER env entry (raw)"
            echo '```json'; cat /tmp/gdu_env.json; echo '```'
            echo "## full env array"
            echo '```json'; cat /tmp/env.json; echo '```'
            echo "## no-op update probe output (live error if provisioning still blocked)"
            echo '```'; cat /tmp/probe.txt; echo '```'
          } > "$OUT"
          cat "$OUT"
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git switch -c "$BR" 2>/dev/null || git switch "$BR"
          git add "$OUT"
          git commit -m "diag: env + secret state"
          git push -f origin "HEAD:$BR"
