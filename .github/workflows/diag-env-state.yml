name: diag-env-state

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main explicitly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current env, secret presence, live provisioning probe (never fail)
        run: |
          set +e
          APP=otchealth-mcp-gateway
          RG=rg-otchealth-apps-prod

          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env.json 2>/tmp/env_err.txt
          echo "env exit: $?"
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets" -o json > /tmp/secrets.json 2>/tmp/secrets_err.txt
          echo "secrets exit: $?"
          az containerapp show -n "$APP" -g "$RG" --query "properties.provisioningState" -o tsv > /tmp/prov.txt 2>&1
          az containerapp show -n "$APP" -g "$RG" --query "properties.latestRevisionName" -o tsv > /tmp/rev.txt 2>&1

          GDU_SECRET=$(jq -r '.[] | select(.name=="graph-drive-user") | .name' /tmp/secrets.json 2>/dev/null)
          jq '.[] | select(.name=="GRAPH_DRIVE_USER")' /tmp/env.json > /tmp/gdu_env.json 2>/dev/null

          # Live reproduction of the blocked provisioning update (no config change, just new revision suffix)
          az containerapp update -n "$APP" -g "$RG" --revision-suffix "diagprobe$(date +%s)" > /tmp/probe.txt 2>&1
          echo "probe exit: $?" >> /tmp/probe.txt

          BR="diag/env-state"
          OUT="diagnostics/env-state.md"
          mkdir -p diagnostics
          {
            echo "# Env + secret state diagnostic"
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## provisioningState"
            echo '```'; cat /tmp/prov.txt; echo '```'
            echo "## latestRevisionName"
            echo '```'; cat /tmp/rev.txt; echo '```'
            echo "## env count"
            echo '```'; jq 'length' /tmp/env.json 2>&1; echo '```'
            echo "## env fetch stderr"
            echo '```'; cat /tmp/env_err.txt; echo '```'
            echo "## graph-drive-user secret present?"
            echo '```'; echo "[$GDU_SECRET]"; echo '```'
            echo "## GRAPH_DRIVE_USER env entry (raw)"
            echo '```json'; cat /tmp/gdu_env.json; echo '```'
            echo "## full env array"
            echo '```json'; cat /tmp/env.json; echo '```'
            echo "## live provisioning probe (revision-suffix update)"
            echo '```'; cat /tmp/probe.txt; echo '```'
          } > "$OUT"
          cat "$OUT"

          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git switch -c "$BR" 2>/dev/null || git switch "$BR"
          git add "$OUT"
          git commit -m "diag: env + secret state" || echo "nothing to commit"
          git push -f origin "HEAD:$BR" || echo "push failed"
          echo "DIAG STEP DONE"
