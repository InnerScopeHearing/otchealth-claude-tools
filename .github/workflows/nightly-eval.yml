# Nightly Eval Baseline — scheduled regression baseline for the fleet (REPORT-ONLY).
#
# Closes roadmap item #3 (Smarter/Cheaper safety net): with Model Router auto-routing to cheaper models
# and a steady stream of prompt/skill changes (compute-allocator, critic-pass, semantic-trust), we need a
# scheduled check that quality still clears the bar. This runs the agent-evals golden-task suite nightly
# (LLM-as-judge on OpenAI, via the Batch API cost lever below, see the OPENAI_BATCH_AGENT_EVALS env
# var on the run step), emits eval_result to PostHog (the durable trend IS the regression baseline),
# uploads the scorecard artifact, and posts a Step Summary with a
# report-only FLOOR guard. It NEVER blocks anything: run-evals.mjs exits 1 whenever any single task fails
# (normal signal), so the run step tolerates that; the baseline is a human-facing signal, not a gate.
#
# Mirrors otchealth-mcp-server's nightly-medic.yml cron pattern. Auth = SECRETLESS AWS OIDC
# (2026-09-03, TASK E-1, replacing the Azure path this comment used to describe): run-evals.mjs
# resolves openai-api-key + posthog-fleet-ingest-key from AWS SSM Parameter Store (/otchealth/*) via
# kvSecret() (SECRET_BACKEND defaults to ssm; see skills/kb-memory/azure-secret.mjs + aws-secret.mjs),
# which needs a real AWS credential in the job's environment to do so. This job assumes
# otchealth-github-nightly-eval, a GitHub-OIDC IAM role in the fleet master account (900915535335)
# trusted ONLY on repo:InnerScopeHearing/otchealth-claude-tools:ref:refs/heads/main, scoped to
# ssm:GetParameter on exactly those two parameter ARNs plus kms:Decrypt on the SSM default managed
# key (alias/aws/ssm) they are encrypted under -- see otchealth-cto/infra/oidc/ (policies/
# trust-nightly-eval.json + permissions-nightly-eval.json + apply-github-oidc-roles.sh) for the exact
# documents and README.md there for the reasoning. No static AWS access key at rest for this job; the
# repo variable AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL (unset until the CTO runs that script and sets it)
# gates the credentials step below -- unset is a clean no-op (the step is skipped and run-evals.mjs
# then fails to resolve openai-api-key on its own, a failure the run step already tolerates).
# SUPERSEDES the prior azure/login federated-OIDC design (repo VARIABLES AZURE_CLIENT_ID/TENANT_ID/
# SUBSCRIPTION_ID): Azure subscription 55c84f6b, which that path authenticated to and which Key Vault
# kv-otc-55c84f6bef (the store run-evals.mjs used to read) lived on, was PERMANENTLY DELETED
# 2026-08-13 -- the azure/login step could never succeed again, not even on a manual
# workflow_dispatch. Regression-ledger tag: monitor-azure-auth-oidc (now AWS, not Azure).
name: Nightly Eval Baseline

on:
  # SCHEDULE DISARMED 2026-08-27: this workflow authenticated to / exercised the Azure estate on
  # subscription 55c84f6b, which was PERMANENTLY DELETED 2026-08-13 -- every scheduled run since
  # then had failed or produced noise against dead resources. workflow_dispatch is kept.
  #
  # STILL DISARMED 2026-09-03 (TASK E-1): the AWS-native credential path now exists (see the header
  # comment above + otchealth-cto/infra/oidc/) so a dispatched run CAN now actually authenticate --
  # but re-arming the schedule is deliberately left to the CTO, not done automatically by this PR,
  # and only after a real workflow_dispatch run is proven green end to end with the new role wired
  # up (repo variable AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL set on this repo).
  # RE-ARMED 2026-09-03 by the CTO, after the gate stated above was actually met: run
  # 33775653832 was dispatched manually on main with AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL set, and was
  # green END TO END on real work, not merely green as a step conclusion. Evidence read from the
  # run log rather than the step status (the run step carries continue-on-error, so a failure and
  # a pass look identical from the outside): the OIDC credential step ran rather than being
  # skipped, run-evals.mjs resolved openai-api-key and posthog-fleet-ingest-key from SSM, all 44
  # golden tasks were scored through the OpenAI Batch lane (39 passed, average 94 percent, judge
  # gpt-5.6-terra), eval_result events were emitted to PostHog, and the scorecard artifact
  # uploaded. The trailing exit code 1 is this harness's documented normal signal that at least
  # one task failed, not a workflow error.
  schedule:
    - cron: '30 6 * * *'   # daily 06:30 UTC (ahead of the 08:00 Nightly Fleet Medic)
  workflow_dispatch: {}     # manual trigger for testing

permissions:
  id-token: write   # secretless OIDC role-assumption in AWS (aws-actions/configure-aws-credentials
                    # assuming otchealth-github-nightly-eval); no static AWS key at rest
  contents: read

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    name: golden-task baseline (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # OIDC role assumption for AWS SSM access (TASK E-1, 2026-09-03), replacing the azure/login
      # step this file used to run: that step targeted Azure subscription 55c84f6b, which was
      # PERMANENTLY DELETED 2026-08-13, so it could never succeed again -- not even on a manual
      # workflow_dispatch. See the file header comment above and otchealth-cto/infra/oidc/README.md
      # for the role's exact trust/permission scope.
      #
      # Guarded with `if:` on the repo variable being non-empty, deliberately NOT the
      # role-to-assume-plus-static-key-fallback shape build-doc-indexer-ecr.yml uses elsewhere in
      # this repo: that shape exists to fall back onto an EXISTING static AWS key when the OIDC
      # variable is unset, and this workflow has no static AWS key to fall back to (its only prior
      # credential was Azure, not AWS). Verified directly against aws-actions/configure-aws-credentials
      # v4.3.1's own source (the exact pinned version below): with role-to-assume AND
      # aws-access-key-id both empty, it does NOT no-op -- it falls through to
      # `credentialsClient.validateCredentials()` against the ambient AWS SDK default provider chain,
      # which finds nothing on a bare GitHub-hosted runner and FAILS the step outright. Without this
      # `if:` guard, an unset repo variable would not be "a clean no-op" as intended -- it would swap
      # one unconditional hard failure (the dead azure/login call) for a different unconditional hard
      # failure (an AWS SDK "could not load credentials" error), which is not an improvement. With
      # the guard, an unset variable means this step does not run at all, and run-evals.mjs then
      # fails to resolve openai-api-key on its own -- a single, clear, self-explanatory error message,
      # in the "Run golden-task suite" step that already tolerates it (continue-on-error: true).
      - name: Configure AWS credentials (OIDC role; skipped entirely until AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL is set)
        if: vars.AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN_NIGHTLY_EVAL }}
          role-session-name: nightly-eval-${{ github.run_id }}
          aws-region: us-east-1

      - name: Run golden-task suite (OpenAI, Batch API) + emit to PostHog
        id: run
        # run-evals.mjs exits 1 if ANY task fails; that is a baseline SIGNAL, not a workflow failure.
        continue-on-error: true
        working-directory: skills/agent-evals
        env:
          # AWS_REGION (2026-09-03, TASK E-1): pinned explicitly so run-evals.mjs's SSM secret
          # resolution (skills/kb-memory/aws-secret.mjs) always signs against us-east-1 regardless
          # of whether the "Configure AWS credentials" step above ran (it exports AWS_REGION itself
          # when it does; this covers the guarded-skip case too, and is otherwise a harmless
          # explicit match of that same default).
          AWS_REGION: 'us-east-1'
          # OPENAI_BATCH_AGENT_EVALS (2026-09-03, T-2, arming the cost lever documented in
          # skills/agent-evals/SKILL.md's "OPENAI_BATCH" section): submits every persona-answer
          # request (then every judge request, since the judge here is the default openai judge --
          # EVAL_JUDGE/JUDGE_PROVIDER are both unset in this workflow) as ONE OpenAI Batch API job
          # each, 50% off the synchronous price, up to a 24h turnaround -- a nightly job is exactly
          # the latency-tolerant shape this lever targets, and this is the FIRST of the six sibling
          # OPENAI_BATCH callers (see setup/model-routing.mjs's BATCH API section header) to actually
          # arm it, since agent-evals already imported every batch helper (buildBatchLine/submitBatch/
          # awaitBatch/assertAllBatchResultsPresent) unused. Requires LLM_PROVIDER=openai (unset here
          # defaults to it -- see run-evals.mjs's own LLM_PROVIDER const); a future
          # LLM_PROVIDER=foundry/azure override on this job would make BATCH_MODE evaluate false and
          # fall back to the pre-existing synchronous per-task path, never crash (see run-evals.mjs's
          # `const BATCH_MODE = LLM_PROVIDER === "openai" && isBatchEnabled("agent-evals")`).
          # Live-proven end to end 2026-09-03 against the real OpenAI Batch API, run locally with a
          # bounded 1-task golden set (this workflow's own schedule is currently disarmed pending an
          # AWS-native credential rebuild, see the header comment above, so a real scheduled/dispatched
          # run of THIS workflow was not exercised as part of arming this flag). Two runs: the first
          # (batch batch_6a990e037a6481908bd4088c55c88ac3) confirmed the persona-answer batch leg
          # completes for real; a second full round trip (persona batch
          # batch_6a99904ddd4c8190bc60880b6e201883 + judge batch
          # batch_6a9990e7a730819090dcdec7923d9908) completed BOTH legs end to end and produced a real
          # scorecard (1/1 passed). Full narrative + exact commands:
          # skills/agent-evals/SKILL.md's "OPENAI_BATCH" section.
          OPENAI_BATCH_AGENT_EVALS: '1'
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code is tee's, not the command's. Without this line this monitor/gate CANNOT FAIL.
          node run-evals.mjs --emit --json "${GITHUB_WORKSPACE}/nightly-scorecard.json" 2>&1 | tee "${GITHUB_WORKSPACE}/nightly-eval.log"

      - name: Baseline summary + floor guard (report-only)
        if: always()
        env:
          EVAL_FLOOR: '0.6'
        run: node skills/agent-evals/nightly-summary.mjs "${GITHUB_WORKSPACE}/nightly-scorecard.json"

      # CI EVAL-GATE (report-only phase; see skills/agent-evals/eval-gate.mjs header). Compares
      # tonight's scorecard against the last recorded baseline.json (repo-tracked, seeded at total=0
      # so this is a no-op until a real baseline exists). NEVER blocks the nightly (no --enforce);
      # this exercises the exact code path a future deploy-time gate (see deploy-eval-gate.yml) would
      # invoke, so its output/format is battle-tested before anything depends on it for real.
      - name: Eval-gate vs last baseline (report-only; --enforce is the future deploy-gate mode)
        if: always()
        run: node skills/agent-evals/eval-gate.mjs "${GITHUB_WORKSPACE}/nightly-scorecard.json" --baseline skills/agent-evals/baseline.json --tolerance 0.05

      - name: Upload scorecard + run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-eval-scorecard
          path: |
            nightly-scorecard.json
            nightly-eval.log
          retention-days: 90
          if-no-files-found: warn

      # ITEM 2.3 (Wave 2, AI-OS research-pass 2026-07-21): schedule-liveness heartbeat. This workflow's
      # own golden-task run above is report-only (continue-on-error) by design, so it can never page on
      # its own content going stale -- this heartbeat is the ONLY signal that would ever catch this
      # workflow's cron itself stopping (a 60-day repo-inactivity schedule disable, a deleted/malformed
      # workflow YAML, a cron typo). Fires unconditionally (if: always()). See
      # skills/nightly-schedule-canary/SKILL.md for the full design.
      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-eval ok >/dev/null 2>&1 || true
