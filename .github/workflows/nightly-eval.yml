# Nightly Eval Baseline — scheduled regression baseline for the fleet (REPORT-ONLY).
#
# Closes roadmap item #3 (Smarter/Cheaper safety net): with Model Router auto-routing to cheaper models
# and a steady stream of prompt/skill changes (compute-allocator, critic-pass, semantic-trust), we need a
# scheduled check that quality still clears the bar. This runs the agent-evals golden-task suite nightly
# (LLM-as-judge on Azure credits — credit-funded, cost-neutral), emits eval_result to PostHog (the durable
# trend IS the regression baseline), uploads the scorecard artifact, and posts a Step Summary with a
# report-only FLOOR guard. It NEVER blocks anything: run-evals.mjs exits 1 whenever any single task fails
# (normal signal), so the run step tolerates that; the baseline is a human-facing signal, not a gate.
#
# Mirrors otchealth-mcp-server's nightly-medic.yml cron pattern. Azure auth = SECRETLESS OIDC
# (2026-07-13): run-evals.mjs resolves Azure OpenAI + PostHog secrets from Key Vault via kvSecret();
# claude-tools CI logs in with azure/login federated OIDC (repo VARIABLES AZURE_CLIENT_ID/TENANT_ID/
# SUBSCRIPTION_ID + id-token: write), the pattern verify-get-secret-migration.yml uses. No AZURE_SP_*
# secret at rest; kvSecret()'s az-CLI/OIDC path mints the KV token from this login. (History: GCP SA ->
# AZURE_SP_* secrets this repo never sets -> OIDC.) Regression-ledger tag: monitor-azure-auth-oidc.
name: Nightly Eval Baseline

on:
  # SCHEDULE DISARMED 2026-08-27: this workflow authenticates to / exercises the Azure estate
  # on subscription 55c84f6b, which was PERMANENTLY DELETED 2026-08-13 -- every scheduled run
  # since then has failed or produced noise against dead resources. workflow_dispatch is kept.
  # Re-arm only as part of an AWS-native rebuild (see the 2026-08-27 migration-audit report).
  # schedule:
  #   - cron: '30 6 * * *'   # daily 06:30 UTC (ahead of the 08:00 Nightly Fleet Medic)
  workflow_dispatch: {}     # manual trigger for testing

permissions:
  id-token: write   # secretless OIDC login to Azure (azure/login); no AZURE_SP_* secret at rest
  contents: read

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    name: golden-task baseline (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Azure login (OIDC, secretless — the claude-tools Azure auth pattern)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run golden-task suite (OpenAI, Batch API) + emit to PostHog
        id: run
        # run-evals.mjs exits 1 if ANY task fails; that is a baseline SIGNAL, not a workflow failure.
        continue-on-error: true
        working-directory: skills/agent-evals
        env:
          # OPENAI_BATCH_AGENT_EVALS (2026-09-03, T-2, arming the cost lever documented in
          # skills/agent-evals/SKILL.md's "OPENAI_BATCH" section): submits every persona-answer
          # request (then every judge request, since the judge here is the default openai judge --
          # EVAL_JUDGE/JUDGE_PROVIDER are both unset in this workflow) as ONE OpenAI Batch API job
          # each, 50% off the synchronous price, up to a 24h turnaround -- a nightly job is exactly
          # the latency-tolerant shape this lever targets, and this is the FIRST of the six sibling
          # OPENAI_BATCH callers (see setup/model-routing.mjs's BATCH API section header) to actually
          # arm it, since agent-evals already imported every batch helper (buildBatchLine/submitBatch/
          # awaitBatch/assertAllBatchResultsPresent) unused. Requires LLM_PROVIDER=openai (unset here
          # defaults to it -- see run-evals.mjs's own LLM_PROVIDER const); a future
          # LLM_PROVIDER=foundry/azure override on this job would make BATCH_MODE evaluate false and
          # fall back to the pre-existing synchronous per-task path, never crash (see run-evals.mjs's
          # `const BATCH_MODE = LLM_PROVIDER === "openai" && isBatchEnabled("agent-evals")`).
          # Live-proven end to end 2026-09-03 against the real OpenAI Batch API, run locally with a
          # bounded 1-task golden set (this workflow's own schedule is currently disarmed pending an
          # AWS-native credential rebuild, see the header comment above, so a real scheduled/dispatched
          # run of THIS workflow was not exercised as part of arming this flag). Two runs: the first
          # (batch batch_6a990e037a6481908bd4088c55c88ac3) confirmed the persona-answer batch leg
          # completes for real; a second full round trip (persona batch
          # batch_6a99904ddd4c8190bc60880b6e201883 + judge batch
          # batch_6a9990e7a730819090dcdec7923d9908) completed BOTH legs end to end and produced a real
          # scorecard (1/1 passed). Full narrative + exact commands:
          # skills/agent-evals/SKILL.md's "OPENAI_BATCH" section.
          OPENAI_BATCH_AGENT_EVALS: '1'
        run: |
          set -o pipefail   # GitHub's default run shell is `bash -e` WITHOUT pipefail: a pipeline's exit code is tee's, not the command's. Without this line this monitor/gate CANNOT FAIL.
          node run-evals.mjs --emit --json "${GITHUB_WORKSPACE}/nightly-scorecard.json" 2>&1 | tee "${GITHUB_WORKSPACE}/nightly-eval.log"

      - name: Baseline summary + floor guard (report-only)
        if: always()
        env:
          EVAL_FLOOR: '0.6'
        run: node skills/agent-evals/nightly-summary.mjs "${GITHUB_WORKSPACE}/nightly-scorecard.json"

      # CI EVAL-GATE (report-only phase; see skills/agent-evals/eval-gate.mjs header). Compares
      # tonight's scorecard against the last recorded baseline.json (repo-tracked, seeded at total=0
      # so this is a no-op until a real baseline exists). NEVER blocks the nightly (no --enforce);
      # this exercises the exact code path a future deploy-time gate (see deploy-eval-gate.yml) would
      # invoke, so its output/format is battle-tested before anything depends on it for real.
      - name: Eval-gate vs last baseline (report-only; --enforce is the future deploy-gate mode)
        if: always()
        run: node skills/agent-evals/eval-gate.mjs "${GITHUB_WORKSPACE}/nightly-scorecard.json" --baseline skills/agent-evals/baseline.json --tolerance 0.05

      - name: Upload scorecard + run log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-eval-scorecard
          path: |
            nightly-scorecard.json
            nightly-eval.log
          retention-days: 90
          if-no-files-found: warn

      # ITEM 2.3 (Wave 2, AI-OS research-pass 2026-07-21): schedule-liveness heartbeat. This workflow's
      # own golden-task run above is report-only (continue-on-error) by design, so it can never page on
      # its own content going stale -- this heartbeat is the ONLY signal that would ever catch this
      # workflow's cron itself stopping (a 60-day repo-inactivity schedule disable, a deleted/malformed
      # workflow YAML, a cron typo). Fires unconditionally (if: always()). See
      # skills/nightly-schedule-canary/SKILL.md for the full design.
      - name: "Heartbeat: mark this workflow's schedule as alive"
        if: always()
        continue-on-error: true
        run: node setup/heartbeat.mjs beat nightly-eval ok >/dev/null 2>&1 || true
