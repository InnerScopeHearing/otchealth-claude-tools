name: publish-evidence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Find newest evidence branch and republish to fixed branch
        run: |
          set -euo pipefail
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git fetch --all --quiet
          BR=$(git branch -r | sed 's/ *origin\///' | grep '^fix/gdu-evidence-' | sort -t- -k3 -n | tail -1)
          echo "Newest evidence branch: $BR"
          git show "origin/$BR:diagnostics/gdu-fix-result.md" > /tmp/result.md
          mkdir -p diagnostics
          cp /tmp/result.md diagnostics/gdu-fix-result-latest.md
          git switch -c fix/gdu-latest 2>/dev/null || git switch fix/gdu-latest
          git add diagnostics/gdu-fix-result-latest.md
          git commit -m "publish latest gdu fix evidence from $BR"
          git push -f origin HEAD:fix/gdu-latest
          echo "PUBLISHED from $BR"
