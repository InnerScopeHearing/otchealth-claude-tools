name: verify-state

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read-only verify, commit to main
        run: |
          set +e
          APP=otchealth-mcp-gateway
          RG=rg-otchealth-apps-prod
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env.json 2>/tmp/e1.txt
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets[].name" -o json > /tmp/secrets.json 2>/tmp/e2.txt
          az containerapp show -n "$APP" -g "$RG" --query identity -o json > /tmp/id.json 2>/tmp/e3.txt
          az containerapp show -n "$APP" -g "$RG" --query "properties.provisioningState" -o tsv > /tmp/prov.txt 2>&1
          GDU=$(jq -r '.[] | select(.name=="GRAPH_DRIVE_USER") | .value' /tmp/env.json 2>/dev/null)
          GDUSEC=$(jq -r '.[]? | select(.=="graph-drive-user")' /tmp/secrets.json 2>/dev/null)
          ENVCOUNT=$(jq 'length' /tmp/env.json 2>/dev/null)
          OUT="diagnostics/verify-state.md"
          mkdir -p diagnostics
          {
            echo "# VERIFY STATE $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "provisioningState: $(cat /tmp/prov.txt)"
            echo "env count: $ENVCOUNT"
            echo "GRAPH_DRIVE_USER value: [$GDU]"
            echo "graph-drive-user secret present: [$GDUSEC]"
            echo "## identity"
            echo '```json'; cat /tmp/id.json; echo '```'
            echo "## all env names sorted"
            echo '```json'; jq -S 'map(.name)|sort' /tmp/env.json 2>&1; echo '```'
            echo "## GRAPH_DRIVE_USER entry"
            echo '```json'; jq '.[]|select(.name=="GRAPH_DRIVE_USER")' /tmp/env.json 2>&1; echo '```'
            echo "## OAUTH_CLIENTS entry"
            echo '```json'; jq '.[]|select(.name=="OAUTH_CLIENTS")' /tmp/env.json 2>&1; echo '```'
            echo "## all secret names"
            echo '```json'; cat /tmp/secrets.json; echo '```'
            echo "## full env"
            echo '```json'; cat /tmp/env.json; echo '```'
          } > "$OUT"
          cat "$OUT"

          set -e
          BR="verify/state-${{ github.run_id }}"
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git switch -c "$BR"
          git add "$OUT"
          git commit -m "verify: post-fix container app state"
          git push origin "HEAD:$BR"
          echo "PUSHED_BRANCH=$BR"
