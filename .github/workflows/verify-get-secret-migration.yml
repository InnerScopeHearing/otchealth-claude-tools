name: verify-get-secret-migration

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch azure-legal-storage-key via az cli directly - length only, never the value
        run: |
          set -euo pipefail
          VALUE_LEN=$(az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-legal-storage-key --query value -o tsv 2>&1 | wc -c) || VALUE_LEN="error"
          echo "azure-legal-storage-key byte length via az cli: $VALUE_LEN"

      - name: Setup node and run the ACTUAL get-secret.mjs script end to end
        env:
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AZURE_SP_CLIENT_ID:-}" ]; then
            echo "AZURE_SP_CLIENT_ID repo secret not set - cannot test the exact script auth path in this workflow. The az-cli-direct check above already confirms the secret itself is reachable via OIDC."
            exit 0
          fi
          node setup/get-secret.mjs azure-legal-storage-key /tmp/out.key
          echo "Script succeeded. Byte length: $(wc -c < /tmp/out.key)"
          rm -f /tmp/out.key
