name: verify-get-secret-migration

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch azure-legal-storage-key via az cli directly - length only, never the value
        run: |
          set -euo pipefail
          VALUE_LEN=$(az keyvault secret show --vault-name kv-otc-55c84f6bef --name azure-legal-storage-key --query value -o tsv 2>&1 | wc -c) || VALUE_LEN="error"
          echo "azure-legal-storage-key byte length via az cli: $VALUE_LEN"

      - name: Setup node and run the ACTUAL get-secret.mjs script end to end
        env:
          # PRIMARY store. get-secret.mjs now resolves through kvSecret(), which reads AWS SSM
          # first, so these are what actually make this verification meaningful post-Azure-exit.
          # AWS_REGION / AWS_SSM_PREFIX fall back to the code defaults (us-east-1, /otchealth).
          SECRET_BACKEND: ssm
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # FALLBACK store. Retained so this workflow still exercises the Key Vault leg if a vault
          # is ever live again; expected to contribute nothing while the subscription is retired.
          AZURE_SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          AZURE_SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          AZURE_SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
        run: |
          set -euo pipefail
          # The old guard skipped unless AZURE_SP_CLIENT_ID was set, which after the cutover would
          # skip on exactly the configuration that now works (AWS creds, no Azure SP). Skip only
          # when NEITHER store has credentials.
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] && [ -z "${AZURE_SP_CLIENT_ID:-}" ]; then
            echo "Neither AWS_ACCESS_KEY_ID nor AZURE_SP_CLIENT_ID is set as a repo secret - cannot exercise the script's own auth path here. The az-cli-direct check above still confirms Key Vault reachability via OIDC."
            exit 0
          fi
          node setup/get-secret.mjs azure-legal-storage-key /tmp/out.key
          echo "Script succeeded. Byte length: $(wc -c < /tmp/out.key)"
          rm -f /tmp/out.key
