# One-time / on-demand admin actions for the OpenSearch off-domain snapshot DR leg
# (skills/fleet-backup/os-snapshot.mjs). NEVER scheduled -- this is deliberately a manual, dispatch-only
# admin tool, not a monitor (that is nightly-aws-dr-canary.yml's job). Use this to:
#   - list-indices    : see how every live index on the domain classifies (non-privileged / privileged)
#   - register        : register the S3 snapshot repository (one-time, or to update role/bucket)
#   - create-policy   : create/update the nightly Snapshot Management policy (non-privileged lane only)
#   - status          : check repo registration + newest successful snapshot age
#   - restore-drill   : run the restore-proof drill on demand (outside the canary's weekly cadence)
#
# GATED (2026-08-28): dispatch-only, no schedule of any kind. `register`/`create-policy` are real
# mutations against a live production OpenSearch domain and MUST be run deliberately by a human who has
# already completed the one-time IAM provisioning in runbooks/aws-dr-provisioning.md (the
# otchealth-brain-snapshot-role the DOMAIN assumes, and the admin identity's own es:ESHttpPut +
# iam:PassRole grants). This workflow assumes NO role of its own by default -- it inherits whatever the
# repository's OIDC trust allows for a workflow_dispatch, which the provisioning doc scopes narrowly
# (see that doc's "Part 2 admin identity" section) rather than reusing either the export or canary role.
#
# PRIVILEGED LANES (--lane personal-legal / --lane finance-legal) remain a disarmed scaffold at the
# os-snapshot.mjs level regardless of what this workflow dispatches -- see that script's header. This
# workflow does not add an arming path for them; OS_SNAPSHOT_CONFIRM_RING_SCOPE=1 would need to be set
# as an explicit, reviewed repo variable for that gate to ever open, and it is deliberately NOT wired
# here.

name: AWS DR OpenSearch Snapshot Admin

on:
  workflow_dispatch:
    inputs:
      verb:
        description: 'os-snapshot.mjs verb to run'
        required: true
        type: choice
        options: [list-indices, register, create-policy, status, restore-drill]
      extra_args:
        description: 'Extra flags to pass through verbatim (e.g. "--role-arn arn:aws:iam::900915535335:role/otchealth-brain-snapshot-role"). Never put a secret value here -- this is logged in plain text in the run.'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

jobs:
  os-snapshot-admin:
    name: ${{ inputs.verb }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC, secretless)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DR_OS_ADMIN_ROLE_ARN || 'arn:aws:iam::900915535335:role/otchealth-brain-snapshot-admin' }}
          aws-region: ${{ vars.SECRETS_DR_S3_REGION || 'us-east-1' }}

      - name: Run os-snapshot.mjs
        env:
          OS_DOMAIN_NAME: ${{ vars.OS_DOMAIN_NAME || 'otchealth-brain' }}
          OS_SNAPSHOT_REPO: ${{ vars.OS_SNAPSHOT_REPO || 'otchealth-brain-s3' }}
          OS_SNAPSHOT_BUCKET: ${{ vars.OS_SNAPSHOT_BUCKET || 'otchealth-brain-dr-55c84f6b' }}
          OS_SNAPSHOT_ROLE_ARN: ${{ vars.OS_SNAPSHOT_ROLE_ARN }}
          VERB: ${{ inputs.verb }}
          EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          set -o pipefail
          # $EXTRA_ARGS is a repo-dispatch input under the operator's own control (not attacker-
          # influenced external content), but is still word-split deliberately here (not interpolated
          # into a larger shell string) so it can only ever add argv tokens to this one fixed command.
          timeout 300 node skills/fleet-backup/os-snapshot.mjs "$VERB" $EXTRA_ARGS
