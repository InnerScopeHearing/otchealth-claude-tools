name: gdu-assert

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  APP: otchealth-mcp-gateway
  RG: rg-otchealth-apps-prod
  VAULT: kv-otc-55c84f6bef

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: A_snapshot_before
        run: |
          set -euo pipefail
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env_before.json
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets[].name" -o json > /tmp/secrets_before.json
          echo "env_before_count=$(jq 'length' /tmp/env_before.json)"

      - name: B_assert_provisioning_state_is_readable
        run: |
          set -euo pipefail
          PS=$(az containerapp show -n "$APP" -g "$RG" --query "properties.provisioningState" -o tsv)
          echo "provisioningState=$PS"

      - name: C_report_graph_drive_user_secret_present_TRUE_means_step_fails
        run: |
          set -euo pipefail
          if jq -e '.[]? | select(.=="graph-drive-user")' /tmp/secrets_before.json >/dev/null 2>&1; then
            echo "graph-drive-user secret STILL PRESENT"
            exit 1
          else
            echo "graph-drive-user secret ABSENT (good)"
          fi

      - name: D_ensure_identity
        run: |
          set -euo pipefail
          az containerapp identity assign -n "$APP" -g "$RG" --system-assigned
          PID=$(az containerapp identity show -n "$APP" -g "$RG" --query principalId -o tsv)
          echo "principalId=$PID"
          echo "$PID" > /tmp/pid.txt

      - name: E_ensure_kv_role
        run: |
          set -euo pipefail
          PID=$(cat /tmp/pid.txt)
          VID=$(az keyvault show --name "$VAULT" --query id -o tsv)
          echo "$VID" > /tmp/vid.txt
          CNT=$(az role assignment list --assignee-object-id "$PID" --scope "$VID" --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" -o tsv)
          echo "existing_role_count=$CNT"
          if [ "${CNT:-0}" = "0" ]; then
            az role assignment create --role "Key Vault Secrets User" --assignee-object-id "$PID" --assignee-principal-type ServicePrincipal --scope "$VID"
            sleep 45
          fi

      - name: F_remove_secret_if_present
        run: |
          set -euo pipefail
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets[].name" -o json > /tmp/secrets_now.json
          if jq -e '.[]? | select(.=="graph-drive-user")' /tmp/secrets_now.json >/dev/null 2>&1; then
            echo "removing graph-drive-user"
            az containerapp secret remove -n "$APP" -g "$RG" --secret-names graph-drive-user
          else
            echo "no graph-drive-user secret to remove"
          fi

      - name: G_set_GRAPH_DRIVE_USER_literal
        run: |
          set -euo pipefail
          az containerapp update -n "$APP" -g "$RG" --set-env-vars "GRAPH_DRIVE_USER=matthew@innd.com"

      - name: H_assert_GRAPH_DRIVE_USER_value_correct
        run: |
          set -euo pipefail
          sleep 10
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env_after.json
          VAL=$(jq -r '.[] | select(.name=="GRAPH_DRIVE_USER") | .value' /tmp/env_after.json)
          echo "GRAPH_DRIVE_USER=[$VAL]"
          test "$VAL" = "matthew@innd.com"

      - name: I_assert_GRAPH_DRIVE_USER_is_literal_not_secretref
        run: |
          set -euo pipefail
          REF=$(jq -r '.[] | select(.name=="GRAPH_DRIVE_USER") | .secretRef // "NONE"' /tmp/env_after.json)
          echo "secretRef=[$REF]"
          test "$REF" = "NONE"

      - name: J_assert_no_other_env_var_changed
        run: |
          set -euo pipefail
          jq -S 'map(select(.name != "GRAPH_DRIVE_USER"))' /tmp/env_before.json > /tmp/bo.json
          jq -S 'map(select(.name != "GRAPH_DRIVE_USER"))' /tmp/env_after.json > /tmp/ao.json
          if ! diff -u /tmp/bo.json /tmp/ao.json; then
            echo "REGRESSION: other env vars changed"
            exit 1
          fi
          echo "regression check passed: all other env vars unchanged"

      - name: K_assert_OAUTH_CLIENTS_present_and_unchanged
        run: |
          set -euo pipefail
          B=$(jq -c '.[] | select(.name=="OAUTH_CLIENTS")' /tmp/env_before.json)
          A=$(jq -c '.[] | select(.name=="OAUTH_CLIENTS")' /tmp/env_after.json)
          echo "OAUTH_CLIENTS_before=$B"
          echo "OAUTH_CLIENTS_after=$A"
          test -n "$A"
          test "$B" = "$A"

      - name: L_report_env_counts
        run: |
          set -euo pipefail
          echo "before=$(jq 'length' /tmp/env_before.json) after=$(jq 'length' /tmp/env_after.json)"

      - name: M_cleanup_delete_role
        run: |
          set -euo pipefail
          PID=$(az containerapp identity show -n "$APP" -g "$RG" --query principalId -o tsv 2>/dev/null || true)
          VID=$(cat /tmp/vid.txt 2>/dev/null || az keyvault show --name "$VAULT" --query id -o tsv)
          if [ -n "${PID:-}" ]; then
            az role assignment delete --assignee-object-id "$PID" --role "Key Vault Secrets User" --scope "$VID" || echo "role already gone"
          fi

      - name: N_cleanup_remove_identity
        run: |
          set -euo pipefail
          az containerapp identity remove -n "$APP" -g "$RG" --system-assigned || echo "identity already removed"

      - name: O_assert_identity_removed
        run: |
          set -euo pipefail
          sleep 5
          T=$(az containerapp show -n "$APP" -g "$RG" --query "identity.type" -o tsv 2>/dev/null || echo "None")
          echo "identity.type=[$T]"
          case "$T" in
            ""|"None"|"none") echo "identity removed OK" ;;
            *) echo "identity still present: $T"; exit 1 ;;
          esac

      - name: P_final_assert_secret_gone_and_value_ok
        run: |
          set -euo pipefail
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets[].name" -o json > /tmp/secrets_final.json
          if jq -e '.[]? | select(.=="graph-drive-user")' /tmp/secrets_final.json >/dev/null 2>&1; then
            echo "graph-drive-user secret STILL present"; exit 1
          fi
          az containerapp show -n "$APP" -g "$RG" --query "properties.template.containers[0].env" -o json > /tmp/env_final.json
          VAL=$(jq -r '.[] | select(.name=="GRAPH_DRIVE_USER") | .value' /tmp/env_final.json)
          test "$VAL" = "matthew@innd.com"
          echo "FINAL OK: secret gone, GRAPH_DRIVE_USER=matthew@innd.com"
