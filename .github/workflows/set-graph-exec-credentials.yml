# RETIRED 2026-10-09 (security finding S-03). This file is a disarmed stub. Do not restore the old body.
#
# What it was: a one-off workflow that pointed the gateway Azure Container App at a new Microsoft Graph
# client (id, secret and tenant) by writing a Container App secret and updating its env vars.
#
# Why it is gone: Azure was permanently deleted on 2026-08-13, so it could only ever fail. It was also an
# injection path and a bad way to carry a credential. The new client secret arrived as a free-text dispatch
# input, which is readable by anyone who can read the run, and all three inputs were pasted straight into
# shell lines in a job that held id-token: write. Its only recorded run was on 2026-07-06, and nothing in this
# repo or in otchealth-mcp-server dispatches it.
#
# What it does now: nothing. No inputs, no permissions, no secrets, no cloud login. Dispatching it fails on
# purpose, so a stale reference is loud instead of silent.
#
# Where to go instead: secrets now live in AWS SSM Parameter Store under /otchealth/ and are written with
# setup/set-secret.mjs, never by pasting a value into a dispatch input. See CLAUDE.md, the 2026-08-27
# correction.
#
# Last working version: commit 5da4eacca1faabc58405b7ae1bc474731bdcb10f.
#
# tests/workflow-input-injection.test.mjs keeps this file a stub.
name: set-graph-exec-credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: retired
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail on purpose
        run: |
          echo "Retired: Azure was deleted on 2026-08-13; see CLAUDE.md (2026-08-27 correction: secrets live in AWS SSM Parameter Store)"
          echo "::error title=set-graph-exec-credentials is retired::Azure was deleted on 2026-08-13; see CLAUDE.md (2026-08-27 correction: secrets live in AWS SSM Parameter Store)"
          exit 1
