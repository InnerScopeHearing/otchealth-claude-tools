name: set-graph-exec-credentials

on:
  workflow_dispatch:
    inputs:
      graph_client_id:
        description: "New GRAPH_CLIENT_ID value"
        required: true
      graph_client_secret:
        description: "New GRAPH_CLIENT_SECRET value (stored as a Container App secret, never printed)"
        required: true
      graph_tenant_id:
        description: "New GRAPH_TENANT_ID value"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  update-gateway-graph-creds:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Snapshot current env (before)
        run: |
          set -euo pipefail
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env-before.json
          echo "Snapshot taken, entry count:"
          python3 -c "import json; print(len(json.load(open('/tmp/env-before.json'))))"

      - name: Store new client secret as a Container App secret
        run: |
          set -euo pipefail
          az containerapp secret set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --secrets "graph-exec-client-secret=${{ inputs.graph_client_secret }}"

      - name: Point GRAPH_CLIENT_SECRET env var at the new secretRef, update ID and tenant literals
        run: |
          set -euo pipefail
          az containerapp update -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --set-env-vars \
              "GRAPH_CLIENT_SECRET=secretref:graph-exec-client-secret" \
              "GRAPH_CLIENT_ID=${{ inputs.graph_client_id }}" \
              "GRAPH_TENANT_ID=${{ inputs.graph_tenant_id }}"

      - name: Force clean cutover to the new revision
        run: |
          set -euo pipefail
          sleep 15
          LATEST=$(az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "sort_by([], &properties.createdTime)[-1].name" -o tsv)
          echo "New revision: $LATEST"
          az containerapp ingress traffic set -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision-weight "${LATEST}=100" || true
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[?name!='${LATEST}' && properties.active].name" -o tsv | while read -r OLD_REV; do
            if [ -n "$OLD_REV" ]; then
              echo "Deactivating: $OLD_REV"
              az containerapp revision deactivate -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --revision "$OLD_REV" || true
            fi
          done
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod --query "[].{name:name, active:properties.active, traffic:properties.trafficWeight}" -o table

      - name: Regression check - confirm unrelated env vars untouched
        run: |
          set -euo pipefail
          sleep 5
          az containerapp show -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "properties.template.containers[0].env" -o json > /tmp/env-after.json
          python3 - <<'PYEOF'
          import json
          before = {e["name"]: e for e in json.load(open("/tmp/env-before.json"))}
          after = {e["name"]: e for e in json.load(open("/tmp/env-after.json"))}
          changed_expected = {"GRAPH_CLIENT_SECRET", "GRAPH_CLIENT_ID", "GRAPH_TENANT_ID"}
          problems = []
          for name, entry in before.items():
              if name in changed_expected:
                  continue
              if after.get(name) != entry:
                  problems.append(name)
          missing = [n for n in before if n not in after]
          if problems or missing:
              print("REGRESSION DETECTED - unexpected changes:", problems, "missing:", missing)
              raise SystemExit(1)
          print("OK: all", len(before), "prior env vars unaffected outside the 3 intended keys")
          for k in changed_expected:
              print(k, "->", after.get(k))
          PYEOF

      - name: Report revision status
        run: |
          set -euo pipefail
          az containerapp revision list -n otchealth-mcp-gateway -g rg-otchealth-apps-prod \
            --query "[?properties.active].{name:name, active:properties.active, trafficWeight:properties.trafficWeight, createdTime:properties.createdTime}" -o table
