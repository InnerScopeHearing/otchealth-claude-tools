name: diag-kv-network

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main explicitly
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Gather full diagnostic state (read-only), commit to branch
        run: |
          set +e
          VAULT=kv-otc-55c84f6bef
          APP=otchealth-mcp-gateway
          RG=rg-otchealth-apps-prod

          az keyvault show --name "$VAULT" --query "properties.networkAcls" -o json > /tmp/kv_acls.json 2>/tmp/kv_acls_err.txt
          echo "kv acls exit: $?"
          az keyvault show --name "$VAULT" --query "properties.publicNetworkAccess" -o json > /tmp/kv_pna.json 2>/tmp/kv_pna_err.txt
          echo "kv pna exit: $?"
          az keyvault show --name "$VAULT" --query "properties.enableRbacAuthorization" -o json > /tmp/kv_rbac.json 2>/tmp/kv_rbac_err.txt
          echo "kv rbac exit: $?"
          az keyvault show --name "$VAULT" --query "id" -o tsv > /tmp/kv_id.txt 2>/tmp/kv_id_err.txt
          echo "kv id exit: $?"
          az keyvault show --name "$VAULT" -o json > /tmp/kv_full.json 2>/tmp/kv_full_err.txt
          echo "kv full exit: $?"

          # Container app identity
          az containerapp identity show -n "$APP" -g "$RG" -o json > /tmp/identity.json 2>/tmp/identity_err.txt
          echo "identity exit: $?"
          PRINCIPAL_ID=$(az containerapp identity show -n "$APP" -g "$RG" --query principalId -o tsv 2>/dev/null)
          echo "principal id: $PRINCIPAL_ID"

          # Role assignments on the vault for this principal
          VAULT_ID=$(cat /tmp/kv_id.txt)
          if [ -n "$PRINCIPAL_ID" ]; then
            az role assignment list --assignee "$PRINCIPAL_ID" --scope "$VAULT_ID" -o json > /tmp/roles.json 2>/tmp/roles_err.txt
            echo "roles exit: $?"
            az role assignment list --assignee "$PRINCIPAL_ID" --all -o json > /tmp/roles_all.json 2>/tmp/roles_all_err.txt
            echo "roles all exit: $?"
          else
            echo "[]" > /tmp/roles.json
            echo "no principal id" > /tmp/roles_err.txt
            echo "[]" > /tmp/roles_all.json
          fi

          # Container app environment id + vnet config
          ENV_ID=$(az containerapp show -n "$APP" -g "$RG" --query "properties.environmentId" -o tsv 2>/dev/null)
          echo "env id: $ENV_ID"
          echo "$ENV_ID" > /tmp/env_id.txt
          if [ -n "$ENV_ID" ]; then
            ENV_NAME=$(basename "$ENV_ID")
            az containerapp env show --ids "$ENV_ID" --query "properties.vnetConfiguration" -o json > /tmp/vnet.json 2>/tmp/vnet_err.txt
            echo "vnet exit: $?"
            az containerapp env show --ids "$ENV_ID" -o json > /tmp/env_full.json 2>/tmp/env_full_err.txt
            echo "env full exit: $?"
          else
            echo "{}" > /tmp/vnet.json
            echo "no env id" > /tmp/vnet_err.txt
            echo "{}" > /tmp/env_full.json
          fi

          # Current secrets on the app
          az containerapp show -n "$APP" -g "$RG" --query "properties.configuration.secrets" -o json > /tmp/secrets.json 2>/tmp/secrets_err.txt
          echo "secrets exit: $?"

          # Private endpoint connections on the vault
          az keyvault show --name "$VAULT" --query "properties.privateEndpointConnections" -o json > /tmp/kv_pe.json 2>/tmp/kv_pe_err.txt
          echo "kv pe exit: $?"

          set -euo pipefail
          BR="diag/kv-network"
          OUT="diagnostics/kv-network.md"
          mkdir -p diagnostics
          {
            echo "# Key Vault network + RBAC diagnostic"
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## networkAcls"
            echo '```json'; cat /tmp/kv_acls.json; echo '```'
            echo "stderr:"; echo '```'; cat /tmp/kv_acls_err.txt; echo '```'
            echo "## publicNetworkAccess"
            echo '```json'; cat /tmp/kv_pna.json; echo '```'
            echo "## enableRbacAuthorization"
            echo '```json'; cat /tmp/kv_rbac.json; echo '```'
            echo "## privateEndpointConnections"
            echo '```json'; cat /tmp/kv_pe.json; echo '```'
            echo "## container app identity"
            echo '```json'; cat /tmp/identity.json; echo '```'
            echo "identity stderr:"; echo '```'; cat /tmp/identity_err.txt; echo '```'
            echo "## role assignments on vault scope for principal"
            echo '```json'; cat /tmp/roles.json; echo '```'
            echo "roles stderr:"; echo '```'; cat /tmp/roles_err.txt; echo '```'
            echo "## ALL role assignments for principal"
            echo '```json'; cat /tmp/roles_all.json; echo '```'
            echo "## environmentId"
            echo '```'; cat /tmp/env_id.txt; echo '```'
            echo "## env vnetConfiguration"
            echo '```json'; cat /tmp/vnet.json; echo '```'
            echo "vnet stderr:"; echo '```'; cat /tmp/vnet_err.txt; echo '```'
            echo "## current app secrets"
            echo '```json'; cat /tmp/secrets.json; echo '```'
          } > "$OUT"
          cat "$OUT"
          git config user.name "otchealth-fleet-bot"
          git config user.email "noreply@otchealth.app"
          git switch -c "$BR" 2>/dev/null || git switch "$BR"
          git add "$OUT"
          git commit -m "diag: kv network + rbac state"
          git push -f origin "HEAD:$BR"
