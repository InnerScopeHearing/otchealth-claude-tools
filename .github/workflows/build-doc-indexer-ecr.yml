name: build-doc-indexer-ecr

# Rebuild + push the shared doc-indexer image to AWS ECR, which is what the 15 scheduled Fargate
# jobs (the librarians, brain-reindex, memory-librarian, ring-memory-index-daily, the deep passes,
# daily-digest, decision-clock, signal-radar, growth-room-nightly, cfo-reconstruction-nightly)
# actually pull.
#
# WHY THIS EXISTS ALONGSIDE build-doc-indexer.yml: that workflow pushes to AZURE ACR
# (otchealthacr) and authenticates with Azure OIDC. Both halves die with the Azure account, and
# neither ever updated the image the AWS jobs run -- so a toolkit change could be merged, appear
# shipped, and never reach a single running job. Merged is not deployed.
#
# CREDENTIALS: a DEDICATED least-privilege IAM user (otchealth-ci-ecr-push) whose only permissions
# are ecr:GetAuthorizationToken plus push/pull on the doc-indexer repository. Deliberately NOT the
# broad aws-cto key, and deliberately NOT the AWS_DR_BREAKGLASS_* secrets -- break-glass credentials
# exist for disaster recovery and stop meaning anything the moment they are used routinely.
#
# The task definitions reference doc-indexer:latest by TAG, not by digest, and Fargate pulls on
# every task start, so a new :latest is picked up by the next scheduled run with no task-definition
# change required.
# BUILD ON MERGE, added 2026-08-18. Until today this workflow was workflow_dispatch ONLY, and every
# one of the 8 runs it had ever had was a manual click. That is not a safety gate, it is a
# remembering gate, and it failed the way remembering gates fail: today's merge-to-deploy gap was
# 14.64 hours, and an earlier one ran 42 hours, during which every "fix" merged to main was inert in
# every running job while the merge itself looked like the fix landing.
#
# The manual step protected nothing. Task definitions reference doc-indexer:latest by TAG and Fargate
# re-pulls on every task start, so jobs were always going to run whatever :latest happened to be. The
# only thing the dispatch-only trigger controlled was WHEN someone remembered to make :latest current.
# main is already protected by the toolkit test gate on every PR, so building from it is not a
# widening of what can reach production; it just removes the interval where main and :latest disagree.
#
# paths-ignore, deliberately, NOT paths. An allowlist fails UNSAFE: a future file in a path nobody
# thought to list silently stops triggering a rebuild, which is precisely the failure being fixed
# here. A denylist fails SAFE: an unrecognised new path still builds. The only entries are paths that
# cannot affect the image, and the Dockerfile copies from the repo root, so almost everything can.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'runbooks/**'
      - 'research/**'
      - 'specs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and push'
        required: false
        default: 'latest'

# Queue, never cancel. Two merges landing close together must both get built: cancelling the first
# would leave :latest carrying the earlier commit while main has moved past it, recreating a smaller
# version of the exact staleness this trigger exists to remove.
concurrency:
  group: build-doc-indexer-ecr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Multi-arch (Graviton prep) ──────────────────────────────────────────────
      # Audited 2026-08-29: this Dockerfile runs NO npm install at all (every COPY'd skill is
      # dependency-free Node using only builtins, confirmed by grepping every top-level require()/
      # import in the doc-indexer entrypoint chain for anything that isn't relative or node:-
      # prefixed -- zero hits), so there are no native npm modules to audit here at all. The base
      # image node:24-slim already publishes a linux/arm64/v8 manifest (same Debian bookworm as the
      # amd64 variant), and the apt packages (poppler-utils, tesseract-ocr, unzip, ca-certificates)
      # are ordinary multi-arch Debian bookworm packages (confirmed against packages.debian.org).
      # node:sqlite (the reason this image is pinned to node:24, not 22 -- see below) is compiled
      # into the Node binary itself, not a separate native addon, so it needs nothing extra for
      # arm64 either. No --platform pin or arch-conditional logic exists in this Dockerfile (the
      # one `architecture: "amd64"` hit anywhere in this repo's doc-indexer tooling is in
      # setup/rebuild-and-repoint.mjs, the retired Azure ACR rebuild path this workflow already
      # supersedes -- untouched here, out of scope, and dead code regardless per this repo's
      # standing Azure-is-gone correction).
      # So the ONLY change needed is here: emulate + build for both platforms and push ONE
      # multi-arch manifest under the same tag. The task definitions reference doc-indexer:latest
      # (or a dispatch-supplied tag) by TAG and Fargate re-pulls on every task start, resolving the
      # correct platform-specific manifest automatically -- so pushing a multi-arch tag today does
      # not change what the currently-running amd64 jobs pull until a task definition is
      # deliberately switched to ARM64/Graviton.
      - name: Set up QEMU (arm64 emulation on the amd64 runner)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ECR_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: skills/doc-indexer/job/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/doc-indexer:${{ github.event.inputs.tag || 'latest' }}
          # GHA layer cache keeps the added arm64 leg (and the apt-get install of poppler-utils +
          # tesseract-ocr, the heaviest layer here) from doubling wall-clock time on every run.
          # There was no cache config before this (a plain `docker build`), so this is new, not a
          # preserved setting.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the pushed artifact a plain two-platform manifest list, matching today's shape
          # (one manifest per tag) just widened to two platforms, rather than also picking up
          # provenance/SBOM attestation manifests as a side effect of this change.
          provenance: false
          sbom: false

      - name: Report the pushed digest + confirm both platforms landed
        env:
          TAG: ${{ github.event.inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          # Print the digest so a caller can prove WHICH image is now :latest rather than trusting
          # that a push happened. Same discipline as everything else in this migration: assert on
          # the observable result, not on the command exiting 0.
          aws ecr describe-images --repository-name doc-indexer \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].{digest:imageDigest,pushed:imagePushedAt,sizeMB:imageSizeInBytes,mediaType:imageManifestMediaType}' \
            --output table

          # A multi-platform build-push-action run can still silently degrade to one platform --
          # so don't just trust that the step exited 0. Pull the actual manifest list back from
          # ECR and assert BOTH platforms are really in it before this workflow reports success.
          aws ecr batch-get-image --repository-name doc-indexer \
            --image-ids imageTag="$TAG" \
            --query 'images[0].imageManifest' --output text > /tmp/manifest.json

          echo "Platforms present under tag $TAG:"
          jq -r '.manifests[]? | "  " + .platform.os + "/" + .platform.architecture + (if .platform.variant then "/" + .platform.variant else "" end) + "  " + .digest' /tmp/manifest.json

          for want in "linux/amd64" "linux/arm64"; do
            jq -e --arg want "$want" '.manifests[]? | select((.platform.os + "/" + .platform.architecture) == $want)' /tmp/manifest.json > /dev/null \
              || { echo "MISSING platform $want under tag $TAG -- multi-arch push did not complete as expected"; exit 1; }
          done
          echo "Confirmed: both linux/amd64 and linux/arm64 are present under doc-indexer:$TAG"
