name: browser-operations-pilot

on:
  pull_request:
    paths:
      - 'projects/browser-operations-pilot/**'
      - '.github/workflows/browser-operations-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'projects/browser-operations-pilot/**'
      - '.github/workflows/browser-operations-pilot.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Policy self-check
        run: node projects/browser-operations-pilot/src/policy.mjs
      - name: Policy test suite
        run: node projects/browser-operations-pilot/test/policy.test.mjs
      - name: Verify no retired GCP secret path in the pilot
        run: '! grep -R "GCP_CLAUDE_DRIVER_SA_JSON\|secretmanager.googleapis.com" projects/browser-operations-pilot'
