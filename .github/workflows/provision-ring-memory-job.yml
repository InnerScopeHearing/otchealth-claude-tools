name: provision-ring-memory-job

# One-click provisioning of the daily Container Apps Job that re-embeds each ring-isolated agent memory
# ledger (CLO legal, CFO finance, ...) into its per-ring AI Search index via skills/ring-memory-index.
# Mirrors the decision-clock/signal-radar job pattern (doc-indexer:latest image, otchealth-jobs-env).
#
# GCP Secret Manager is retired (billing off, 2026-07). This job authenticates Azure-first via the
# fleet service principal (AZURE_SP_CLIENT_ID/TENANT_ID plain + AZURE_SP_CLIENT_SECRET secretref),
# which resolves every downstream secret (search/openai/storage) from Key Vault kv-otc-55c84f6bef
# (see skills/kb-memory/azure-secret.mjs). No GCP creds are provisioned or required.
#
# command/args are proven working in production: command:["node"], args:[".../index-ring-memory.mjs","all"]
# (command overrides the image's ENTRYPOINT ["node","/app/skills/doc-indexer/indexer.mjs"] cleanly —
# verified via a real Container Apps Job execution reaching Succeeded on 2026-07-05, after fixing an
# unconditional GCP-SA-file read in index-ring-memory.mjs that crashed the container before it ever
# reached the Key Vault path). OIDC auth for the Azure control-plane login (no stored SP secret for
# az login itself). Idempotent: create, else update.
on:
  workflow_dispatch:
    inputs:
      cron:
        description: 'Cron expression (UTC)'
        required: false
        default: '40 23 * * *'

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Create or update ring-memory-index-daily
        env:
          SP_CLIENT_ID: ${{ secrets.AZURE_SP_CLIENT_ID }}
          SP_TENANT_ID: ${{ secrets.AZURE_SP_TENANT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.AZURE_SP_CLIENT_SECRET }}
          KEYVAULT_NAME: ${{ vars.AZURE_KEYVAULT_NAME || 'kv-otc-55c84f6bef' }}
          CRON: ${{ github.event.inputs.cron }}
        run: |
          set -euo pipefail
          ACR_PWD=$(az acr credential show -n otchealthacr --query "passwords[0].value" -o tsv)
          COMMON=(-n ring-memory-index-daily -g otchealth-automation-rg
            --image otchealthacr.azurecr.io/doc-indexer:latest
            --registry-server otchealthacr.azurecr.io --registry-username otchealthacr --registry-password "${ACR_PWD}"
            --cpu 1 --memory 2Gi
            --command node --args "/app/skills/ring-memory-index/index-ring-memory.mjs" "all")
          if az containerapp job show -n ring-memory-index-daily -g otchealth-automation-rg >/dev/null 2>&1; then
            echo "job exists -> update"
            az containerapp job update "${COMMON[@]}" \
              --replica-timeout 1800 --replica-retry-limit 1 \
              --set-env-vars "AZURE_SP_CLIENT_ID=${SP_CLIENT_ID}" "AZURE_SP_TENANT_ID=${SP_TENANT_ID}" \
                "AZURE_KEYVAULT_NAME=${KEYVAULT_NAME}" "AZURE_SP_CLIENT_SECRET=secretref:azure-sp-secret"
            az containerapp job secret set -n ring-memory-index-daily -g otchealth-automation-rg \
              --secrets "azure-sp-secret=${SP_CLIENT_SECRET}" "acr-pwd=${ACR_PWD}"
          else
            echo "job absent -> create"
            az containerapp job create "${COMMON[@]}" \
              --environment otchealth-jobs-env --trigger-type Schedule --cron-expression "${CRON}" \
              --replica-timeout 1800 --replica-retry-limit 1 \
              --secrets "azure-sp-secret=${SP_CLIENT_SECRET}" "acr-pwd=${ACR_PWD}" \
              --env-vars "AZURE_SP_CLIENT_ID=${SP_CLIENT_ID}" "AZURE_SP_TENANT_ID=${SP_TENANT_ID}" \
                "AZURE_KEYVAULT_NAME=${KEYVAULT_NAME}" "AZURE_SP_CLIENT_SECRET=secretref:azure-sp-secret"
          fi
          echo "Provisioned ring-memory-index-daily (cron ${CRON}) — Azure-first auth via Key Vault ${KEYVAULT_NAME}, no GCP creds."
